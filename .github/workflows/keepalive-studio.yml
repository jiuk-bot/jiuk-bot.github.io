name: keepalive-ai-studio

# AI 소재 A/B 스튜디오 데모가 잠들지 않게, 2시간마다 실제 브라우저(Playwright)로 방문한다.
#  → Streamlit Community Cloud의 sleep 타이머를 리셋하고, 혹시 자고 있으면 wake 버튼을 눌러 깨운다.
on:
  schedule:
    - cron: "0 */2 * * *"   # 2시간마다 (UTC) — 하루 12회
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright (chromium)
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Ping & wake studio
        run: python ai-creative-studio/keep_alive.py
