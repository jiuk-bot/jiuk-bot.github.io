<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/hero-surgery.jpg" fetchpriority="high">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%;background:#081530}
  body{
    min-height:100%;
    background:#081530;
    background-image:radial-gradient(ellipse at top,#15294D 0%,#081530 55%,#040B1C 100%);
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    color:#EDE7DA;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    font-weight:450;
    letter-spacing:-.02em;
    overflow-x:hidden;
  }
  a[href^="tel"],a[x-apple-data-detectors]{color:inherit!important;text-decoration:none!important;background:transparent!important;pointer-events:none}

  .lp{
    max-width:960px;margin:0 auto;
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;
    align-items:center;
    padding:0 0 24px;
    position:relative;
  }
  .wrap{width:100%;display:flex;flex-direction:column;align-items:center}

  /* 카운트다운 바 */
  .urgency-bar{
    width:100%;
    background:linear-gradient(90deg,#A88444 0%,#D4B57A 50%,#A88444 100%);
    color:#0A1F40;
    text-align:center;
    padding:11px 16px;
    font-size:clamp(15px,3.6vw,20px);
    font-weight:800;letter-spacing:-.01em;
    box-shadow:0 2px 12px rgba(212,181,122,.25);
    position:relative;overflow:hidden;
  }
  .urgency-bar .urg-dot{
    display:inline-block;width:7px;height:7px;background:#E84040;border-radius:50%;
    margin-right:7px;vertical-align:middle;
    animation:urgBlink 1s infinite;box-shadow:0 0 8px #E84040;
  }
  @keyframes urgBlink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}
  .urgency-bar .urg-time{
    font-family:'Inter',sans-serif;font-feature-settings:'tnum' 1;
    background:rgba(10,31,64,.92);color:#E8CC91;
    padding:4px 11px;border-radius:5px;
    margin-left:8px;letter-spacing:.04em;font-weight:700;
  }

  /* 히어로 */
  .hero{
    width:100%;position:relative;
    padding:24px 14px 22px;
    text-align:center;
    overflow:hidden;
    background:#0A1F40;
    border-bottom:1px solid rgba(255,200,60,.18);
  }
  .hero-img{
    position:absolute;top:0;left:0;width:100%;height:100%;
    object-fit:cover;object-position:center center;
    z-index:0;opacity:0;transition:opacity .4s;
    filter:saturate(.68) brightness(.68) hue-rotate(-22deg) contrast(1.1);
  }
  .hero-overlay{
    position:absolute;top:0;left:0;width:100%;height:100%;
    background:linear-gradient(180deg,
      rgba(8,21,48,.78) 0%,
      rgba(8,21,48,.82) 35%,
      rgba(8,21,48,.92) 65%,
      #081530 92%);
    z-index:1;
  }
  .hero .badge,.hero .headline{position:relative;z-index:2}

  /* 뱃지 */
  .badge{
    display:inline-flex;align-items:center;gap:10px;
    background:rgba(212,181,122,.1);
    border:1.5px solid rgba(212,181,122,.45);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:#F0DAA8;
    font-size:clamp(20px,4.8vw,28px);
    font-weight:800;letter-spacing:.02em;
    padding:11px 24px;border-radius:32px;margin-bottom:14px;
    box-shadow:0 4px 18px rgba(0,0,0,.2);
  }
  .badge .dot{width:7px;height:7px;background:#D4B57A;border-radius:50%;animation:blink 1.6s infinite;box-shadow:0 0 9px #D4B57A}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

  /* 헤드카피 */
  .headline{width:100%;display:flex;flex-direction:column;align-items:center}
  .headline .hl-small{
    display:block;
    font-size:clamp(34px,7.6vw,56px);
    font-weight:700;color:#FFFFFF;
    letter-spacing:-.025em;line-height:1.18;
    text-shadow:0 2px 14px rgba(0,0,0,.5),0 0 24px rgba(255,255,255,.08);
    margin-bottom:6px;
  }
  .headline .hl-main{
    display:block;
    font-size:clamp(72px,15vw,124px);
    font-weight:900;color:#5B7FFF;
    letter-spacing:-.05em;line-height:1.02;word-break:keep-all;
    text-shadow:0 2px 18px rgba(91,127,255,.35);
    background:linear-gradient(180deg,#9AB1FF 0%,#5B7FFF 45%,#3D5FE8 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 14px rgba(91,127,255,.3));
  }

  /* 강조 비주얼 (가격대) */
  .hl-feature{
    display:flex;align-items:baseline;justify-content:center;
    gap:0;margin:10px 0 0;
    white-space:nowrap;
    max-width:100%;
    padding:0 4px;
  }
  .hl-feature .feat-num{
    font-family:'Inter','Pretendard Variable',sans-serif;
    font-feature-settings:'tnum' 1,'lnum' 1;
    font-size:clamp(96px,24vw,210px);
    font-weight:800;
    letter-spacing:-.08em;line-height:.88;
    background:linear-gradient(180deg,#9AB1FF 0%,#5B7FFF 45%,#3D5FE8 80%,#2E47B8 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 4px 16px rgba(91,127,255,.3));
    padding-right:.06em;
  }
  .hl-feature .feat-label{
    font-size:clamp(34px,8.4vw,72px);
    font-weight:700;letter-spacing:-.06em;line-height:1;
    background:linear-gradient(180deg,#9AB1FF 0%,#3D5FE8 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    flex-shrink:0;
  }
  .hl-feature .feat-tail{
    display:inline-block;
    font-size:.58em;
    font-weight:700;
    letter-spacing:-.03em;
    margin-left:.18em;
    vertical-align:.22em;
    background:linear-gradient(180deg,#9AB1FF 0%,#3D5FE8 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  /* 콘텐츠 영역 */
  .content{width:100%;padding:12px 14px 0;display:flex;flex-direction:column;align-items:center;gap:10px}

  /* USP 3분할 */
  .usp{
    width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;
  }
  .usp-card{
    text-align:center;
    background:linear-gradient(160deg,rgba(255,255,255,.05) 0%,rgba(255,200,60,.05) 100%);
    border:1.5px solid rgba(255,200,60,.32);
    border-radius:18px;padding:22px 4px 22px;
    box-shadow:0 4px 18px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    position:relative;
  }
  .usp-icon{
    font-size:clamp(38px,8vw,56px);
    line-height:1;margin-bottom:12px;
    filter:drop-shadow(0 2px 10px rgba(91,127,255,.35));
  }
  .usp-title{
    font-size:clamp(20px,5.2vw,34px);
    font-weight:800;
    letter-spacing:-.04em;line-height:1.18;
    word-break:keep-all;
    margin-bottom:0;
    background:linear-gradient(180deg,#9AB1FF 0%,#5B7FFF 50%,#3D5FE8 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 1px 6px rgba(91,127,255,.2));
  }

  /* 실시간 피드 */
  .live-feed{
    width:100%;
    background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,rgba(255,200,60,.04) 100%);
    border:1px solid rgba(255,200,60,.25);
    border-radius:14px;padding:12px 16px;
    box-shadow:0 4px 16px rgba(0,0,0,.25);
  }
  .feed-header{
    display:flex;align-items:center;gap:7px;
    font-size:clamp(12px,2.8vw,15px);
    color:#5B7FFF;font-weight:700;
    margin-bottom:6px;letter-spacing:.04em;
  }
  .feed-dot{width:7px;height:7px;background:#FF5A5A;border-radius:50%;animation:liveBlink 1.2s infinite;box-shadow:0 0 8px #FF5A5A}
  @keyframes liveBlink{0%,100%{opacity:1}50%{opacity:.4}}
  .feed-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:5px 0;
    font-size:clamp(13px,3.1vw,17px);
    color:#D4C8B0;font-weight:500;letter-spacing:-.01em;
    transition:opacity .3s,transform .3s;
  }
  .feed-row:not(:last-child){border-bottom:1px solid rgba(255,200,60,.1)}
  .feed-row strong{color:#F4E0B0;font-weight:700}
  .feed-row .hl{color:#5B7FFF;font-weight:700}
  .feed-row .time{color:#7A736A;font-size:clamp(11px,2.6vw,14px);flex-shrink:0;margin-left:8px;font-family:'Inter','Pretendard Variable',sans-serif}

  /* 타이핑 */
  .typing-bar{
    width:100%;text-align:center;
    font-size:clamp(15px,3.4vw,19px);
    font-weight:600;color:#D4B57A;
    min-height:22px;letter-spacing:-.01em;
    margin-top:0;opacity:.95;
  }
  .typing-bar .cursor{animation:cursorBlink .7s infinite;color:#D4B57A;font-weight:300}
  @keyframes cursorBlink{0%,100%{opacity:1}50%{opacity:0}}

  /* CTA */
  .cta-wrap{width:100%}
  .cta-btn{
    display:block;width:100%;padding:18px 12px;
    background:linear-gradient(135deg,#F0DAA8 0%,#D4B57A 45%,#C9A664 70%,#A88444 100%);
    color:#0A1F40;
    font-size:clamp(19px,4.6vw,26px);
    font-weight:700;letter-spacing:-.02em;
    border:none;border-radius:60px;cursor:pointer;
    font-family:inherit;
    box-shadow:0 10px 32px rgba(212,181,122,.35),inset 0 1px 0 rgba(255,255,255,.4),0 1px 4px rgba(0,0,0,.3);
    text-align:center;position:relative;overflow:hidden;
    transition:all .2s;
    animation:ctaPulse 2.6s ease-in-out infinite;
  }
  @keyframes ctaPulse{
    0%,100%{box-shadow:0 10px 32px rgba(212,181,122,.35),inset 0 1px 0 rgba(255,255,255,.4),0 1px 4px rgba(0,0,0,.3)}
    50%{box-shadow:0 12px 40px rgba(212,181,122,.6),inset 0 1px 0 rgba(255,255,255,.5),0 1px 4px rgba(0,0,0,.3)}
  }
  .cta-btn:active{transform:scale(.97)}
  .cta-btn .shimmer{
    position:absolute;top:0;left:-100%;width:60%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
    animation:shimmer 3s ease-in-out infinite;pointer-events:none;
  }
  @keyframes shimmer{0%{left:-100%}50%{left:110%}100%{left:110%}}

  /* 폼 팝업 */
  .form-overlay{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(4,11,28,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    z-index:9998;opacity:0;pointer-events:none;
    transition:opacity .3s;
  }
  .form-overlay.open{opacity:1;pointer-events:auto}
  .form-popup{
    position:fixed;bottom:0;left:0;width:100%;
    z-index:9999;
    transform:translateY(100%);
    transition:transform .35s cubic-bezier(.16,1,.3,1);
  }
  .form-popup.open{transform:translateY(0)}
  .form-card{
    position:relative;
    max-width:720px;margin:0 auto;
    background:linear-gradient(180deg,#0F2347 0%,#0A1B38 100%);
    border-top:1px solid rgba(212,181,122,.25);
    border-radius:26px 26px 0 0;
    padding:28px 28px 32px;
    box-shadow:0 -10px 50px rgba(0,0,0,.55);
  }
  .form-handle{width:44px;height:5px;background:rgba(212,181,122,.35);border-radius:3px;margin:0 auto 18px}
  .form-close{
    position:absolute;top:18px;right:20px;
    width:38px;height:38px;border:none;
    background:rgba(255,255,255,.05);border-radius:50%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;color:#B8B0A0;transition:all .2s;z-index:1;
  }
  .form-close:hover{background:rgba(255,255,255,.1);color:#FFFFFF}
  .form-title{text-align:center;font-size:19px;font-weight:700;color:#F4E0B0;margin-bottom:3px;letter-spacing:-.025em}
  .form-sub{text-align:center;font-size:14px;color:#B8B0A0;margin-bottom:12px;font-weight:500;letter-spacing:.01em}
  .form-area{width:100%}
  .form-inner-cta{width:100%;margin-top:10px;display:none}
  .form-btn{
    display:block;width:100%;padding:14px;
    background:linear-gradient(135deg,#F0DAA8 0%,#D4B57A 45%,#C9A664 70%,#A88444 100%);
    color:#0A1F40;
    font-size:18px;font-weight:700;letter-spacing:-.02em;
    border:none;border-radius:50px;cursor:pointer;
    font-family:inherit;
    box-shadow:0 8px 24px rgba(212,181,122,.32),inset 0 1px 0 rgba(255,255,255,.4);
    text-align:center;position:relative;overflow:hidden;
  }
  .form-btn .shimmer{
    position:absolute;top:0;left:-100%;width:60%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
    animation:shimmer 3s ease-in-out infinite;pointer-events:none;
  }
  .form-btn:active{transform:scale(.97)}

  /* 약관 동의 모달 (v4 신규: 2단계 진입 패턴) */
  .agree-overlay{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(4,11,28,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    z-index:10000;opacity:0;pointer-events:none;
    transition:opacity .25s;
  }
  .agree-overlay.open{opacity:1;pointer-events:auto}
  .agree-modal{
    position:fixed;top:50%;left:50%;
    transform:translate(-50%,-45%) scale(.95);
    width:calc(100% - 32px);max-width:480px;
    z-index:10001;opacity:0;pointer-events:none;
    transition:opacity .25s,transform .3s cubic-bezier(.16,1,.3,1);
  }
  .agree-modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .agree-card{
    position:relative;
    background:linear-gradient(180deg,#0F2347 0%,#0A1B38 100%);
    border:1px solid rgba(212,181,122,.28);
    border-radius:20px;
    padding:30px 24px 24px;
    box-shadow:0 24px 60px rgba(0,0,0,.6);
    text-align:center;
  }
  .agree-title{
    font-size:18px;font-weight:800;color:#F4E0B0;
    letter-spacing:-.025em;line-height:1.4;margin-bottom:6px;
  }
  .agree-warn{
    font-size:13px;font-weight:500;color:#B8B0A0;
    line-height:1.5;margin-bottom:18px;
  }
  .agree-link{
    display:flex;align-items:center;justify-content:flex-start;
    gap:6px;font-size:14px;color:#EDE7DA;font-weight:600;
    padding:0 4px;margin-bottom:14px;
    text-align:left;letter-spacing:.01em;
  }
  .agree-link .agree-detail-toggle{
    color:#D4B57A;text-decoration:underline;cursor:pointer;font-weight:700;
  }
  .agree-detail-box{
    display:none;text-align:left;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(212,181,122,.18);
    border-radius:10px;
    padding:12px 14px;margin-bottom:14px;
    font-size:12px;color:#B8B0A0;line-height:1.7;
    max-height:160px;overflow-y:auto;letter-spacing:.01em;
  }
  .agree-detail-box.open{display:block}
  .agree-btn{
    display:block;width:100%;padding:16px;
    background:linear-gradient(135deg,#F0DAA8 0%,#D4B57A 45%,#C9A664 70%,#A88444 100%);
    color:#0A1F40;
    font-size:17px;font-weight:800;letter-spacing:-.02em;
    border:none;border-radius:50px;cursor:pointer;
    font-family:inherit;
    box-shadow:0 8px 24px rgba(212,181,122,.4),inset 0 1px 0 rgba(255,255,255,.4);
    text-align:center;position:relative;overflow:hidden;
  }
  .agree-btn:active{transform:scale(.97)}
  .agree-btn .shimmer{
    position:absolute;top:0;left:-100%;width:60%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
    animation:shimmer 3s ease-in-out infinite;pointer-events:none;
  }
  .agree-close{
    position:absolute;top:14px;right:14px;
    width:32px;height:32px;border:none;
    background:rgba(255,255,255,.06);border-radius:50%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;color:#B8B0A0;transition:all .2s;z-index:1;
  }
  .agree-close:hover{background:rgba(255,255,255,.1);color:#FFFFFF}

  /* 푸터 */
  .footer-trust{
    display:flex;align-items:center;justify-content:center;
    gap:8px;flex-wrap:nowrap;margin-top:2px;white-space:nowrap;
  }
  .footer-trust span{font-size:11px;color:#7A736A;font-weight:500;letter-spacing:.01em;white-space:nowrap;flex-shrink:0}
  @media(max-width:360px){
    .footer-trust{gap:6px}
    .footer-trust span{font-size:10px;letter-spacing:0}
  }

  /* 아임웹 오버라이드 */
  .widget-form,.w-section,[data-widget-type="form"],[data-widget-type]{margin-top:0!important;margin-bottom:0!important;padding-top:0!important;padding-bottom:0!important}
  .widget-form-wrap,.section-element,.se-component{margin:0!important;padding:0!important}
  #wrap,.container,.content-container{width:100%!important}
  .widget,[class*="widget-wrap"]{width:100%!important;max-width:100%!important;margin:0 auto!important;padding:0!important}

  @media(min-width:768px){
    .content{max-width:960px;padding:18px 40px 0}
    .hero{padding:36px 40px 32px}
    .usp-card{padding:22px 4px 22px}

    /* PC: 폼 팝업을 화면 중앙 모달로 전환 (모바일은 바텀시트 유지) */
    .form-popup{
      bottom:auto!important;
      top:50%;left:50%;
      width:92%;max-width:520px;
      transform:translate(-50%,-46%);
      opacity:0;
      transition:opacity .25s ease,transform .35s cubic-bezier(.16,1,.3,1);
    }
    .form-popup.open{
      transform:translate(-50%,-50%);
      opacity:1;
    }
    .form-card{
      border-radius:22px;
      padding:32px 32px 28px;
      box-shadow:0 24px 60px rgba(0,0,0,.6);
    }
    .form-handle{display:none}
  }

  /* 스티키 CTA */
  .sticky-cta{
    position:fixed;bottom:0;left:0;right:0;
    z-index:9990;
    padding:12px 16px 16px;
    background:rgba(8,21,48,.92);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid rgba(212,181,122,.18);
    box-shadow:0 -6px 24px rgba(0,0,0,.4);
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.16,1,.3,1);
  }
  .sticky-cta.show{transform:translateY(0)}
  .sticky-cta-inner{max-width:960px;margin:0 auto}
  .sticky-cta-btn{
    display:block;width:100%;padding:18px;
    background:linear-gradient(135deg,#F0DAA8 0%,#D4B57A 45%,#C9A664 70%,#A88444 100%);
    color:#0A1F40;
    font-size:18px;font-weight:700;letter-spacing:-.02em;
    border:none;border-radius:50px;cursor:pointer;
    font-family:inherit;
    box-shadow:0 6px 20px rgba(212,181,122,.35),inset 0 1px 0 rgba(255,255,255,.4);
    text-align:center;position:relative;overflow:hidden;
  }
  .sticky-cta-btn:active{transform:scale(.97)}
  .sticky-cta-btn .shimmer{position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shimmer 3s ease-in-out infinite;pointer-events:none}
</style>
</head>
<body>

<div class="lp"><div class="wrap">

  <!-- 히어로 -->
  <div class="hero">
    <img src="img/hero-surgery.jpg" alt="" class="hero-img" fetchpriority="high" decoding="async" onload="this.style.opacity=1">
    <div class="hero-overlay"></div>
    <div class="badge"><span class="dot"></span> 양심치과 무료 매칭</div>
    <div class="headline">
      <h1>
        <span class="hl-small">양심치과 소개</span>
        <span class="hl-main">임플란트</span>
      </h1>
      <div class="hl-feature">
        <span class="feat-num">20</span>
        <span class="feat-label">만원<span class="feat-tail">대</span></span>
      </div>
    </div>
  </div>

  <div class="content">

    <!-- USP 3분할 -->
    <div class="usp">
      <div class="usp-card">
        <div class="usp-icon">&#128203;</div>

        F+' input:-webkit-autofill,'+F+' input:-webkit-autofill:hover,'+F+' input:-webkit-autofill:focus,'+F+' input:-webkit-autofill:active{-webkit-text-fill-color:#FFFFFF!important;-webkit-box-shadow:0 0 0 1000px rgba(255,255,255,.06) inset!important;box-shadow:0 0 0 1000px rgba(255,255,255,.06) inset!important;caret-color:#FFFFFF!important;transition:background-color 9999s ease-in-out 0s!important;font-weight:600!important;color:#FFFFFF!important}'+

    var styleInterval=setInterval(function(){
      fw.querySelectorAll('input').forEach(applyInputStyle);
      styleRetry++;if(styleRetry>30)clearInterval(styleInterval);
    },500);
  }
  // 입력 색상/배경 강제 (위젯 inline style 덮기 + autofill 차단)
  function forceAllInputs(){
    var fw=document.getElementById(FORM_ID);if(!fw)return;
    fw.querySelectorAll('input').forEach(function(i){
      if(!i||i.type==='hidden'||i.type==='checkbox'||i.type==='radio')return;
      i.style.setProperty('color','#FFFFFF','important');
      i.style.setProperty('-webkit-text-fill-color','#FFFFFF','important');
      i.style.setProperty('caret-color','#FFFFFF','important');
      i.style.setProperty('font-weight','600','important');
      // 010 박스 옆 input은 wrapper가 배경 처리하므로 transparent
      if(i.closest('.lp-ph-mid')||i.closest('.lp-ph-last')){
        i.style.setProperty('background','transparent','important');
        i.style.setProperty('background-color','transparent','important');
        i.style.setProperty('background-image','none','important');
        i.style.setProperty('border','none','important');
        i.style.setProperty('box-shadow','none','important');
      }else{
        i.style.setProperty('background','rgba(255,255,255,.06)','important');
        i.style.setProperty('background-color','rgba(255,255,255,.06)','important');
        i.style.setProperty('background-image','none','important');
      }
      i.style.setProperty('-webkit-appearance','none','important');
      i.style.setProperty('appearance','none','important');
    });
  }
  setInterval(forceAllInputs,150);
  document.addEventListener('focusin',function(e){if(e.target&&e.target.tagName==='INPUT')forceAllInputs()});
  document.addEventListener('input',function(e){if(e.target&&e.target.tagName==='INPUT')forceAllInputs()});
  document.addEventListener('change',function(e){if(e.target&&e.target.tagName==='INPUT')forceAllInputs()});

  var fr=0,fi=setInterval(function(){if(customizeForm()||fr>30)clearInterval(fi);fr++},500);

  // 스티키 CTA
  var stickyCta=document.getElementById('stickyCta');
  var stickyBtn=document.getElementById('stickyCtaBtn');
  if(stickyCta&&stickyBtn){
    stickyBtn.addEventListener('click',openForm);
    function updateSticky(){
      var y=window.scrollY||window.pageYOffset;
      var atBot=(y+window.innerHeight)>=(document.documentElement.scrollHeight-120);
      stickyCta.classList.toggle('show',!atBot);
    }
    updateSticky();
    window.addEventListener('scroll',updateSticky,{passive:true});
  }
})();
</script>

<div class="sticky-cta" id="stickyCta">
  <div class="sticky-cta-inner">
    <button type="button" class="sticky-cta-btn" id="stickyCtaBtn">
      <span class="shimmer"></span>
      무료상담 + 지원금 조회 →
    </button>
  </div>
</div>
