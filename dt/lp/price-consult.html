<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/hero-consult.jpg" fetchpriority="high">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{height:100%;background:#FFF9F4}
  body{min-height:100%;background:#FFF9F4;font-family:'Noto Sans KR',sans-serif;color:#2C1810;-webkit-font-smoothing:antialiased;font-weight:500;overflow-x:hidden}

  .lp{
    max-width:560px;margin:0 auto;
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;
    align-items:center;
    padding:0 0 28px;
  }
  .wrap{width:100%;display:flex;flex-direction:column;align-items:center}

  /* 히어로 */
  .hero{
    width:100%;position:relative;
    padding:44px 18px 40px;
    text-align:center;
    overflow:hidden;
    background:#E8DDD4;
  }
  .hero-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:center 25%;z-index:0;opacity:0;transition:opacity .3s}
  .hero-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.55) 30%,rgba(255,255,255,.75) 55%,rgba(255,255,255,.92) 75%,#fff 90%);z-index:1}
  .hero .badge,.hero .headline{position:relative;z-index:2}

  /* 뱃지 */
  .badge{
    display:inline-flex;align-items:center;gap:7px;
    background:rgba(255,255,255,.85);border:1.5px solid rgba(255,87,87,.3);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:#FF5757;font-size:16px;font-weight:900;
    padding:9px 22px;border-radius:24px;margin-bottom:14px;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
  }
  .badge .dot{width:7px;height:7px;background:#FF5757;border-radius:50%;animation:blink 1.5s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  /* 헤드카피 */
  .headline{width:100%}
  .headline h1{font-size:38px;font-weight:900;color:#1a0e08;line-height:1.3;letter-spacing:-2px;word-break:keep-all;text-shadow:0 1px 6px rgba(255,255,255,.6)}
  .headline .price-row{display:flex;align-items:baseline;justify-content:center;gap:2px;margin:8px 0 6px}
  .headline .price{font-family:'Montserrat',sans-serif;font-size:110px;font-weight:900;color:#FF5757;letter-spacing:-6px;line-height:1;text-shadow:0 2px 10px rgba(255,87,87,.25)}
  .headline .price-unit{font-size:46px;font-weight:900;color:#FF5757;letter-spacing:-1px}
  .headline .sub{font-size:24px;font-weight:800;color:#3D2E24;text-shadow:0 1px 4px rgba(255,255,255,.6)}

  /* 콘텐츠 영역 */
  .content{width:100%;padding:0 22px;display:flex;flex-direction:column;align-items:center;gap:16px}

  /* 신뢰 칩 */
  .trust{display:flex;justify-content:center;gap:8px;width:100%}
  .trust-chip{
    flex:1;text-align:center;
    background:#fff;border:1px solid #F0E4D8;
    border-radius:14px;padding:12px 4px;
  }
  .trust-chip .val{font-family:'Montserrat',sans-serif;font-size:24px;font-weight:900;color:#FF5757;display:block;line-height:1.1}
  .trust-chip .lbl{font-size:14px;color:#A89080;font-weight:700;margin-top:3px}

  /* 포인트 카드 */
  .points{width:100%;display:flex;flex-direction:column;gap:10px}
  .point{
    display:flex;align-items:center;justify-content:space-between;
    background:#fff;border:1px solid #F0E4D8;
    border-radius:16px;padding:18px 20px;
    box-shadow:0 2px 12px rgba(44,24,16,.04);
  }
  .point-info{flex:1}
  .point-title{font-size:20px;font-weight:900;color:#2C1810;margin-bottom:3px}
  .point-desc{font-size:14px;font-weight:600;color:#A89080}
  .point-icon{font-size:36px;flex-shrink:0;width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:rgba(255,87,87,.06);border-radius:14px}

  /* 타이핑 애니메이션 */
  .typing-bar{
    width:100%;text-align:center;
    font-size:17px;font-weight:700;color:#FF5757;
    min-height:24px;
  }
  .typing-bar .cursor{animation:cursorBlink .7s infinite}
  @keyframes cursorBlink{0%,100%{opacity:1}50%{opacity:0}}

  /* CTA 버튼 */
  .cta-wrap{width:100%}
  .cta-btn{
    display:block;width:100%;padding:18px;
    background:linear-gradient(135deg,#FF5757,#E84040);color:#fff;
    font-size:20px;font-weight:900;letter-spacing:-.5px;
    border:none;border-radius:50px;cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
    box-shadow:0 6px 24px rgba(255,87,87,.3);
    text-align:center;position:relative;overflow:hidden;
    transition:all .2s;
  }
  .cta-btn:active{transform:scale(.97)}
  .cta-btn .shimmer{
    position:absolute;top:0;left:-100%;width:60%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);
    animation:shimmer 3s ease-in-out infinite;pointer-events:none;
  }
  @keyframes shimmer{0%{left:-100%}50%{left:110%}100%{left:110%}}

  /* 폼 팝업 (바텀시트) */
  .form-overlay{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(44,24,16,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    z-index:9998;opacity:0;pointer-events:none;
    transition:opacity .3s;
  }
  .form-overlay.open{opacity:1;pointer-events:auto}

  .form-popup{

    position:fixed;bottom:0;left:0;width:100%;
    z-index:9999;
    transform:translateY(100%);
    transition:transform .35s cubic-bezier(.16,1,.3,1);
  }
  .form-popup.open{transform:translateY(0)}

  .form-card{position:relative;
    max-width:560px;margin:0 auto;
    background:#fff;
    border-radius:24px 24px 0 0;
    padding:24px 22px 28px;
    box-shadow:0 -8px 40px rgba(44,24,16,.12);
  }
  .form-handle{width:40px;height:4px;background:#E5D9CC;border-radius:2px;margin:0 auto 16px}
  .form-close{position:absolute;top:16px;right:18px;width:36px;height:36px;border:none;background:rgba(0,0,0,.05);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;color:#A89080;transition:all .2s;z-index:1}.form-close:hover{background:rgba(0,0,0,.1);color:#2C1810}
  .form-title{text-align:center;font-size:21px;font-weight:900;color:#2C1810;margin-bottom:3px}
  .form-sub{text-align:center;font-size:15px;color:#A89080;margin-bottom:16px;font-weight:500}
  .form-area{width:100%}
  .form-inner-cta{width:100%;margin-top:12px;display:none}
  .form-btn{
    display:block;width:100%;padding:18px;
    background:linear-gradient(135deg,#FF5757,#E84040);color:#fff;
    font-size:20px;font-weight:900;letter-spacing:-.5px;
    border:none;border-radius:50px;cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
    box-shadow:0 6px 24px rgba(255,87,87,.3);
    text-align:center;position:relative;overflow:hidden;
  }
  .form-btn .shimmer{
    position:absolute;top:0;left:-100%;width:60%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);
    animation:shimmer 3s ease-in-out infinite;pointer-events:none;
  }
  .form-btn:active{transform:scale(.97)}

  /* 하단 */
  .footer-trust{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:8px}
  .footer-trust span{font-size:14px;color:#A89080}

  /* 아임웹 오버라이드 */
  .widget-form,.w-section,[data-widget-type="form"],[data-widget-type]{margin-top:0!important;margin-bottom:0!important;padding-top:0!important;padding-bottom:0!important}
  .widget-form-wrap,.section-element,.se-component{margin:0!important;padding:0!important}
  #wrap,.container,.content-container{width:100%!important}
  .widget,[class*="widget-wrap"]{width:100%!important;max-width:100%!important;margin:0 auto!important;padding:0!important}

  @media(min-width:768px){
    .content{max-width:560px;padding:0 40px}
    .hero{padding:56px 40px 36px}
  }

  /* 스티키 CTA */
  .sticky-cta{
    position:fixed;bottom:0;left:0;right:0;
    z-index:9990;
    padding:10px 16px 14px;
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-top:1px solid rgba(255,87,87,.1);
    box-shadow:0 -4px 20px rgba(0,0,0,.06);
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.16,1,.3,1);
  }
  .sticky-cta.show{transform:translateY(0)}
  .sticky-cta-inner{max-width:560px;margin:0 auto}
  .sticky-cta-btn{
    display:block;width:100%;padding:16px;
    background:linear-gradient(135deg,#FF5757,#E84040);color:#fff;
    font-size:18px;font-weight:900;letter-spacing:-.5px;
    border:none;border-radius:50px;cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
    box-shadow:0 4px 16px rgba(255,87,87,.3);
    text-align:center;position:relative;overflow:hidden;
  }
  .sticky-cta-btn:active{transform:scale(.97)}
  .sticky-cta-btn .shimmer{position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);animation:shimmer 3s ease-in-out infinite;pointer-events:none}
</style>
</head>
<body>

<div class="lp"><div class="wrap">

  <!-- 히어로: 치과 이미지 + 그라데이션 오버레이 -->
  <div class="hero">
    <img src="img/hero-consult.jpg" alt="" class="hero-img" fetchpriority="high" decoding="async" onload="this.style.opacity=1">
    <div class="hero-overlay"></div>
    <div class="badge"><span class="dot"></span> 경기도 지역 한정 특별가</div>
    <div class="headline">
      <h1>국산정품 임플란트</h1>
      <div class="price-row">
        <span class="price">28</span>
        <span class="price-unit">만원</span>
      </div>
      <div class="sub">식립 개수 상관없이 동일가격</div>
    </div>
  </div>

  <div class="content">

    <div class="trust">
      <div class="trust-chip"><span class="val">28</span><span class="lbl">만원 확정</span></div>
      <div class="trust-chip"><span class="val">0</span><span class="lbl">원 추가금</span></div>
      <div class="trust-chip"><span class="val">1:1</span><span class="lbl">전담 치료</span></div>
    </div>

    <div class="points">
      <div class="point">
        <div class="point-info">
          <div class="point-title">초기부담 ZERO</div>
          <div class="point-desc">부담 없는 분납 시스템</div>
        </div>
        <div class="point-icon">&#128179;</div>
      </div>
      <div class="point">
        <div class="point-info">
          <div class="point-title">추가금 0원</div>
          <div class="point-desc">확정가 그대로, 숨은 비용 없음</div>
        </div>
        <div class="point-icon">&#128176;</div>
      </div>
      <div class="point">
        <div class="point-info">
          <div class="point-title">10년 무상 A/S</div>
          <div class="point-desc">치료 이후까지 꾸준한 관리</div>
        </div>
        <div class="point-icon">&#128170;</div>
      </div>
    </div>

    <div class="typing-bar" id="typingBar"></div>

    <!-- CTA 버튼 -->
    <div class="cta-wrap">
      <button type="button" class="cta-btn" id="ctaBtn">
        <span class="shimmer"></span>
        무료 상담 신청하기 &#8594;
      </button>
    </div>

    <div class="footer-trust">
      <span>&#128274; 개인정보 보호</span>
      <span>&#9889; 즉시 확인</span>
      <span>&#128172; 24시간 내 연락</span>
    </div>

  </div>
</div></div>

<!-- 폼 팝업 (바텀시트) -->
<div class="form-overlay" id="formOverlay"></div>
<div class="form-popup" id="formPopup">
  <div class="form-card">
    <div class="form-handle"></div>
    <button type="button" class="form-close" id="formClose">&times;</button>
    <div class="form-title">30초 간편 상담신청</div>
    <div class="form-sub">이름과 연락처만 남겨주세요</div>
    <div class="form-area" id="formArea">
      <!-- 아임웹 입력폼 위젯 배치 -->
    </div>
    <div class="form-inner-cta" id="formInnerCta">
      <button type="button" class="form-btn" id="formBtn">
        <span class="shimmer"></span>
        상담 신청 완료하기
      </button>
    </div>
  </div>
</div>

<script>
(function(){
  var FORM_ID='w202602052340a9ba8a410';

  // CTA 버튼 → 폼 팝업 토글
  var ctaBtn=document.getElementById('ctaBtn');
  var formOverlay=document.getElementById('formOverlay');
  var formPopup=document.getElementById('formPopup');

  function openForm(){
    formOverlay.classList.add('open');
    formPopup.classList.add('open');
    document.body.style.overflow='hidden';if(stickyCta)stickyCta.classList.remove('show');
    setTimeout(function(){
      var nameInp=formPopup.querySelector('input[type="text"]');
      if(nameInp)nameInp.focus({preventScroll:true});
    },350);
  }
  function closeForm(){
    formOverlay.classList.remove('open');
    formPopup.classList.remove('open');
    document.body.style.overflow='';if(stickyCta)stickyCta.classList.add('show');
  }

  ctaBtn.addEventListener('click',openForm);
  formOverlay.addEventListener('click',closeForm);
  document.getElementById('formClose').addEventListener('click',closeForm);

  // 타이핑 애니메이션
  var msgs=['지금 선착순 혜택 받으세요!','경기도 지역 특별 할인 진행중','이번 달 한정 28만원 확정가'];
  var typingBar=document.getElementById('typingBar');
  var msgIdx=0,charIdx=0,deleting=false;
  function typeLoop(){
    var msg=msgs[msgIdx];
    if(!deleting){
      charIdx++;
      typingBar.innerHTML=msg.substring(0,charIdx)+'<span class="cursor">|</span>';
      if(charIdx>=msg.length){setTimeout(function(){deleting=true;typeLoop()},2000);return}
      setTimeout(typeLoop,80);
    }else{
      charIdx--;
      typingBar.innerHTML=msg.substring(0,charIdx)+'<span class="cursor">|</span>';
      if(charIdx<=0){deleting=false;msgIdx=(msgIdx+1)%msgs.length;setTimeout(typeLoop,400);return}
      setTimeout(typeLoop,40);
    }
  }
  typeLoop();

  // 아임웹 폼 이동
  function moveForm(){
    var fw=document.getElementById(FORM_ID);
    if(fw){
      var widget=fw.closest('.widget-form')||fw.closest('[data-widget-type]')||fw.closest('.w-section')||fw;
      var area=document.getElementById('formArea');
      if(area&&widget){
        area.appendChild(widget);
        widget.style.cssText='margin:0!important;padding:0!important;background:transparent!important';
      }
      return true;
    }
    return false;
  }
  var mr=0,mi=setInterval(function(){if(moveForm()||mr>30)clearInterval(mi);mr++},500);

  // 개인정보 텍스트 숨기기
  function hidePrivacy(){
    var fw=document.getElementById(FORM_ID)||document.querySelector('.widget-form')||document.querySelector('[data-widget-type="form"]');
    if(!fw)return;
    fw.querySelectorAll('textarea').forEach(function(el){el.style.cssText='display:none!important'});
    fw.querySelectorAll('div').forEach(function(el){
      if(el.querySelector('input[type="text"],input[type="tel"],input[type="email"]'))return;
      if(el.closest('.lp-agree-w'))return;
      if(el.querySelector('.lp-agree-w'))return;
      var txt=(el.innerText||'').substring(0,300);
      if(txt.indexOf('수집 및 이용')>-1&&txt.length>50)el.style.cssText='display:none!important;height:0!important;overflow:hidden!important;margin:0!important;padding:0!important';
    });
  }
  var pr=0,pi=setInterval(function(){hidePrivacy();pr++;if(pr>20)clearInterval(pi)},800);

  // 폼 커스터마이징
  function customizeForm(){
    var fw=document.getElementById(FORM_ID);if(!fw)return false;
    hidePrivacy();

    if(!document.getElementById('ic-form-css')){
      var st=document.createElement('style');st.id='ic-form-css';var F='#'+FORM_ID;
      st.textContent=
        F+','+F+' *{font-family:"Noto Sans KR",sans-serif!important}'+
        F+'{background:transparent!important;border:none!important;padding:0!important;max-width:100%!important;margin:0!important;box-shadow:none!important;width:100%!important}'+
        F+' form,'+F+' .form-inner,'+F+' .form-content{padding:0!important;margin:0!important;width:100%!important;background:transparent!important}'+
        F+' .form-group,'+F+' .field-wrap,'+F+' [class*="field"]{margin-bottom:12px!important}'+
        '.widget-form,.w-section,[data-widget-type]{background:transparent!important;margin:0!important;padding:0!important}'+
        F+' input[type="text"],'+F+' input[type="tel"],'+F+' input[type="email"],'+F+' select{background:#FFF9F4!important;border:1.5px solid #F0E4D8!important;border-radius:12px!important;color:#2C1810!important;font-size:17px!important;padding:15px 14px!important;width:100%!important;outline:none!important;-webkit-appearance:none!important;transition:border-color .2s!important;margin:0!important}'+
        F+' input:focus{border-color:#FF5757!important;box-shadow:0 0 0 3px rgba(255,87,87,.08)!important}'+
        F+' input::placeholder{color:#A89080!important;font-size:15px!important}'+
        F+' label{color:#7A6355!important;font-size:14px!important;font-weight:600!important;margin-bottom:5px!important;display:block!important}'+
        F+' button[type="submit"],'+F+' .wbtn,'+F+' [class*="submit"]{position:absolute!important;width:1px!important;height:1px!important;clip:rect(0,0,0,0)!important;opacity:0!important;pointer-events:none!important}'+
        F+' textarea{display:none!important}'+

        '.lp-ph-row{display:flex;gap:6px;align-items:center;width:100%}'+
        '.lp-ph-010{background:rgba(255,87,87,.06)!important;border:1.5px solid rgba(255,87,87,.15)!important;border-radius:10px!important;color:#FF5757!important;font-size:16px!important;font-weight:800!important;padding:15px 0!important;width:56px!important;min-width:56px!important;text-align:center!important;flex-shrink:0!important}'+
        '.lp-ph-dash{color:#A89080;font-size:14px;flex-shrink:0}'+
        '.lp-ph-mid,.lp-ph-last{flex:1;min-width:0}'+
        '.lp-ph-mid input,.lp-ph-last input{text-align:center!important;font-size:18px!important;font-weight:600!important;letter-spacing:3px!important;padding:15px 4px!important;border-radius:10px!important}'+

        '.lp-agree-w{margin:10px 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:nowrap}'+
        '.lp-agree-l{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;color:#7A6355;white-space:nowrap;flex-wrap:nowrap;line-height:1}'+
        '.lp-agree-cb{-webkit-appearance:checkbox!important;appearance:checkbox!important;width:20px!important;height:20px!important;min-width:20px;min-height:20px;accent-color:#FF5757;cursor:pointer;flex-shrink:0;margin:0!important;padding:0!important;position:relative;top:1px}'+
        '.lp-agree-l span{line-height:20px}'+
        '.lp-agree-tog{color:#FF5757;font-size:13px;cursor:pointer;white-space:nowrap;word-break:keep-all;line-height:20px}'+
        '.lp-form-err{display:none;text-align:center;color:#EF4444;font-size:14px;font-weight:600;margin-top:8px;padding:10px;background:rgba(239,68,68,.04);border:1px solid rgba(239,68,68,.1);border-radius:10px}'+
        '@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}';
      document.head.appendChild(st);
    }

    // 010 고정
    var ai=fw.querySelectorAll('input'),pis=[];
    ai.forEach(function(i){var n=(i.name||'').toLowerCase(),p=(i.placeholder||'').toLowerCase();if(n.indexOf('phone')>-1||n.indexOf('tel')>-1||n.indexOf('hp')>-1||p.indexOf('연락')>-1||p.indexOf('전화')>-1||p.indexOf('010')>-1||i.type==='tel')pis.push(i)});
    if(pis.length>=3){
      var p1=pis[0],p2=pis[1],p3=pis[2],pc=p1.closest('.form-group')||p1.closest('[class*="field"]')||p1.parentNode;
      var row=document.createElement('div');row.className='lp-ph-row';
      var box=document.createElement('div');box.className='lp-ph-010';box.textContent='010';
      p1.value='010';p1.readOnly=true;p1.type='hidden';
      var d1=document.createElement('span');d1.className='lp-ph-dash';d1.textContent='-';
      var d2=document.createElement('span');d2.className='lp-ph-dash';d2.textContent='-';
      var mw=document.createElement('div');mw.className='lp-ph-mid';p2.placeholder='0000';p2.maxLength=4;p2.setAttribute('inputmode','numeric');mw.appendChild(p2);
      var lw=document.createElement('div');lw.className='lp-ph-last';p3.placeholder='0000';p3.maxLength=4;p3.setAttribute('inputmode','numeric');lw.appendChild(p3);
      row.appendChild(box);row.appendChild(d1);row.appendChild(mw);row.appendChild(d2);row.appendChild(lw);pc.appendChild(row);
      p2.addEventListener('input',function(){if(this.value.length>=4)p3.focus()});
    }

    // 원본 버튼 숨기기 + 동의 UI
    var sb=fw.querySelectorAll('button[type="submit"],input[type="submit"],.wbtn,[class*="submit"]'),ob=sb[0];
    sb.forEach(function(b){b.style.cssText='position:absolute!important;width:1px!important;height:1px!important;clip:rect(0,0,0,0)!important;opacity:0!important;pointer-events:none!important'});

    if(ob){
      var cbs=fw.querySelectorAll('input[type="checkbox"]');cbs.forEach(function(c){if(!c.closest('.lp-agree-w')){var lb=c.closest('label')||c.parentNode;if(lb&&lb!==fw)lb.style.cssText='display:none!important;'}});

      var aw=document.createElement('div');aw.className='lp-agree-w';
      aw.innerHTML='<label class="lp-agree-l"><input type="checkbox" class="lp-agree-cb" id="icAgreeCb"><span>개인정보 수집 및 이용 동의</span></label><span class="lp-agree-tog" id="icAgreeTog">[자세히]</span>';
      var err=document.createElement('div');err.className='lp-form-err';err.id='icFormErr';
      ob.parentNode.insertBefore(aw,ob);
      ob.parentNode.insertBefore(err,ob);

      var innerCta=document.getElementById('formInnerCta');
      if(innerCta)innerCta.style.display='block';

      document.getElementById('formBtn').addEventListener('click',function(){
        var vi=fw.querySelectorAll('input[type="text"]:not([type="hidden"]),input[type="tel"]:not([type="hidden"]),input:not([type])'),ef=[];
        vi.forEach(function(i){if(i.readOnly||i.type==='hidden'||!i.offsetParent)return;if(!i.value.trim())ef.push(i)});
        if(ef.length>0){ef.forEach(function(i){i.style.borderColor='#EF4444';i.style.boxShadow='0 0 0 3px rgba(239,68,68,.08)';setTimeout(function(){i.style.borderColor='';i.style.boxShadow=''},3000)});err.textContent='모든 항목을 입력해주세요';err.style.display='block';err.style.animation='shakeX .4s ease';ef[0].focus();setTimeout(function(){err.style.display='none'},4000);return}
        var ac=document.getElementById('icAgreeCb');if(ac&&!ac.checked){err.textContent='개인정보 수집 및 이용에 동의해주세요';err.style.display='block';return}
        err.style.display='none';ob.style.pointerEvents='auto';ob.click();ob.style.pointerEvents='none';
      });

      var detailOpen=false;
      document.getElementById('icAgreeTog').addEventListener('click',function(){clearInterval(pi);var pe=fw.querySelector('div.form-control')||fw.querySelector('textarea');if(!pe)return;if(detailOpen){pe.style.cssText='display:none!important;';this.textContent='[자세히]';detailOpen=false}else{pe.style.cssText='display:block!important;border:1px solid #E5D9CC!important;padding:12px!important;height:100px!important;overflow-y:auto!important;margin:8px 0 10px!important;font-size:13px!important;color:#7A6355!important;line-height:1.8!important;border-radius:10px!important;background:#FFF9F4!important;';var pp=pe.parentNode;while(pp&&pp!==fw){if(window.getComputedStyle(pp).display==='none')pp.style.cssText='display:block!important;';pp=pp.parentNode}this.textContent='[접기]';detailOpen=true}});

      document.getElementById('icAgreeCb').addEventListener('change',function(){var ch=this.checked;cbs.forEach(function(c){c.checked=ch})});
    }
    return true;
  }
  var fr=0,fi=setInterval(function(){if(customizeForm()||fr>30)clearInterval(fi);fr++},500);

  // 스티키 CTA
  var stickyCta=document.getElementById('stickyCta');
  var stickyBtn=document.getElementById('stickyCtaBtn');
  if(stickyCta&&stickyBtn){
    stickyBtn.addEventListener('click',openForm);
    function updateSticky(){
      var y=window.scrollY||window.pageYOffset;
      var atBot=(y+window.innerHeight)>=(document.documentElement.scrollHeight-120);
      stickyCta.classList.toggle('show',!atBot);
    }
    updateSticky();
    window.addEventListener('scroll',updateSticky,{passive:true});
  }
})();
</script>

<div class="sticky-cta" id="stickyCta">
  <div class="sticky-cta-inner">
    <button type="button" class="sticky-cta-btn" id="stickyCtaBtn">
      <span class="shimmer"></span>
      무료 상담 신청하기 →
    </button>
  </div>
</div>

<div style="position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:99999;font:700 11px/1 'Pretendard',sans-serif;color:#fff;background:rgba(31,111,235,.92);padding:6px 13px;border-radius:999px">포트폴리오 예시 · 실제 상담 접수 안 됨</div>
<script>
(function(){
  function thanks(){
    var o=document.createElement('div');
    o.style.cssText='position:fixed;inset:0;z-index:99998;background:rgba(10,14,24,.6);display:flex;align-items:center;justify-content:center;padding:24px';
    o.innerHTML='<div style="background:#fff;border-radius:18px;max-width:340px;width:100%;padding:30px 24px;text-align:center;font-family:Pretendard,sans-serif">'+
      '<div style="width:60px;height:60px;margin:0 auto 16px;border-radius:50%;background:linear-gradient(135deg,#1f6feb,#2b55d8);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center">&#10003;</div>'+
      '<div style="font-size:19px;font-weight:800;color:#1a2030;margin-bottom:8px">상담 신청이 접수되었습니다</div>'+
      '<div style="font-size:13px;color:#8a92a2;line-height:1.6">포트폴리오 예시 페이지입니다.<br>실제로 전송되지 않습니다.</div>'+
      '<button style="margin-top:20px;border:0;background:#eef1f5;color:#5b6472;font-weight:800;padding:12px 28px;border-radius:12px;cursor:pointer">닫기</button></div>';
    o.addEventListener('click',function(e){ if(e.target===o||e.target.tagName==='BUTTON') o.remove(); });
    document.body.appendChild(o);
  }
  document.addEventListener('click',function(e){
    var fid=document.getElementById('agreeBtn')?'#agreeBtn':'#formBtn';var t=e.target.closest&&e.target.closest(fid);
    if(t){ e.preventDefault(); e.stopImmediatePropagation(); thanks(); }
  },true);
})();
</script>
