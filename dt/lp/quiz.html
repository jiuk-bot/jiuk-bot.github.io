<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 진짜 임플란트 견적은?</title>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <style>
        /* CSS 접두사 senior-quiz- 적용하여 아임웹 스타일과 충돌 방지 */
        .senior-quiz-wrapper {
            font-family: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #0A1128;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            box-sizing: border-box;
        }

        .senior-quiz-container {
            width: 100%;
            max-width: 500px;
            background: #1C2541;
            border-radius: 24px;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 1. 실시간 가격 계산기 판넬 (Top Sticky) */
        .senior-quiz-calculator-panel {
            background: rgba(10, 17, 40, 0.8);
            border: 2px dashed #38BDF8;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .senior-quiz-calc-title {
            font-size: 14px;
            color: #94A3B8;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .senior-quiz-price-flow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .senior-quiz-original-price {
            text-decoration: line-through;
            color: #64748B;
            font-size: 16px;
            font-weight: 500;
        }

        .senior-quiz-discount-arrow {
            color: #38BDF8;
            font-weight: 900;
        }

        /* 고급스러운 스카이블루(#38BDF8) 컬러로 단가 강조 */
        .senior-quiz-live-price {
            font-size: 32px;
            font-weight: 800;
            color: #38BDF8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
            transition: transform 0.1s ease;
        }

        /* 첫 화면 조회 대기중일 때의 맥박 애니메이션 */
        .senior-quiz-live-price.waiting-state {
            font-size: 26px;
            color: #94A3B8;
            animation: text-pulse 1.5s infinite ease-in-out;
            text-shadow: none;
        }

        @keyframes text-pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; transform: scale(1.02); color: #38BDF8; }
            100% { opacity: 0.6; }
        }

        .senior-quiz-live-price.price-animate {
            transform: scale(1.1);
            color: #10B981;
        }

        .senior-quiz-discount-tag {
            background-color: #1E3A8A;
            border: 1px solid #3B82F6;
            color: #38BDF8;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-top: 4px;
            align-self: center;
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        /* 2. 토스 스타일 프리미엄 알림 카드 (Toast Card) - 주황색 배제 및 신뢰성 화이트 카드 형태 */
        .senior-quiz-toast-banner {
            background-color: #FFFFFF;
            color: #191F28;
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 14px;
            font-weight: 600;
            display: none;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            border: 1px solid #E5E8EB;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            animation: slide-down-banner 0.4s ease-out forwards;
        }

        .senior-quiz-toast-check-icon {
            color: #3182F6; /* 토스 시그니처 블루 체크 */
            font-weight: bold;
            font-size: 16px;
            margin-right: 4px;
        }

        @keyframes slide-down-banner {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 3. 진행 상태 바 */
        .senior-quiz-progress-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .senior-quiz-progress-text {
            font-size: 14px;
            color: #94A3B8;
            font-weight: bold;
            white-space: nowrap;
        }

        .senior-quiz-progress-bar-bg {
            flex-grow: 1;
            height: 10px;
            background: #0A1128;
            border-radius: 5px;
            overflow: hidden;
        }

        .senior-quiz-progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #3B82F6 0%, #38BDF8 100%);
            width: 33%;
            border-radius: 5px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 4. 질문지 본문 */
        .senior-quiz-step-content {
            display: none;
            flex-direction: column;
            gap: 20px;
            animation: slide-fade 0.4s ease-out forwards;
        }

        .senior-quiz-step-content.active {
            display: flex;
        }

        @keyframes slide-fade {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .senior-quiz-question {
            font-size: 21px;
            font-weight: 800;
            line-height: 1.4;
            color: #FFFFFF;
            text-align: center;
            margin-bottom: 5px;
        }

        .senior-quiz-subtitle {
            font-size: 14px;
            color: #94A3B8;
            text-align: center;
            margin-top: -15px;
            margin-bottom: 10px;
        }

        /* 5. 대형 버튼 리스트 */
        .senior-quiz-btn-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .senior-quiz-choice-btn {
            background: #0A1128;
            border: 2px solid #3B82F6;
            border-radius: 16px;
            padding: 18px 24px;
            font-size: 18px;
            font-weight: 700;
            color: #FFFFFF;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .senior-quiz-choice-btn:hover {
            background: #1E3A8A;
            border-color: #38BDF8;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(56, 189, 248, 0.15);
        }

        .senior-quiz-choice-btn:active {
            transform: scale(0.98);
        }

        .senior-quiz-btn-subtext {
            font-size: 13px;
            color: #94A3B8;
            font-weight: 400;
            margin-top: 4px;
            display: block;
        }

        .senior-quiz-btn-arrow {
            color: #38BDF8;
            font-size: 20px;
            font-weight: bold;
        }

        /* 잘 모름 버튼 (우회용) 디자인 차별화 */
        .senior-quiz-choice-btn.unknown-option {
            border-color: #64748B;
            background: rgba(10, 17, 40, 0.5);
        }
        .senior-quiz-choice-btn.unknown-option:hover {
            border-color: #94A3B8;
            background: #334155;
        }

        /* 6. 최종 폼 레이아웃 */
        .senior-quiz-final-box {
            text-align: center;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .senior-quiz-final-price-label {
            font-size: 16px;
            color: #94A3B8;
            font-weight: bold;
        }

        .senior-quiz-final-price {
            font-size: 38px;
            font-weight: 800;
            color: #38BDF8;
        }

        .senior-quiz-input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .senior-quiz-input-field {
            background: #0A1128;
            border: 2px solid #3B82F6;
            border-radius: 12px;
            padding: 16px;
            font-size: 18px;
            color: #FFFFFF;
            box-sizing: border-box;
            width: 100%;
            transition: border-color 0.2s;
        }

        .senior-quiz-input-field:focus {
            outline: none;
            border-color: #38BDF8;
        }

        /* 고급스러운 토스 블루 그라디언트 CTA 버튼 적용 (#3182F6 -> #0064FF) */
        .senior-quiz-submit-btn {
            background: linear-gradient(135deg, #3182F6 0%, #0064FF 100%);
            border: none;
            border-radius: 16px;
            padding: 18px;
            font-size: 20px;
            font-weight: 800;
            color: #FFFFFF;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 100, 255, 0.4);
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .senior-quiz-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 100, 255, 0.6);
        }

        .senior-quiz-submit-btn:active {
            transform: scale(0.98);
        }

        .senior-quiz-trust-badge {
            font-size: 12px;
            color: #64748B;
            line-height: 1.5;
            margin-top: 5px;
            display: flex;
            gap: 4px;
            justify-content: center;
            align-items: flex-start;
            text-align: left;
        }

        .senior-quiz-lock-icon {
            font-size: 14px;
            flex-shrink: 0;
        }

        /* 모바일 반응형 터치 크기 보강 */
        @media (max-width: 768px) {
            .senior-quiz-container {
                padding: 16px;
                gap: 16px;
            }
            .senior-quiz-choice-btn {
                padding: 16px 20px;
                font-size: 17px;
            }
            .senior-quiz-question {
                font-size: 19px;
            }
            .senior-quiz-live-price {
                font-size: 28px;
            }
        }
    </style>
</head>
<body style="margin: 0;">

    <div class="senior-quiz-wrapper">
        <div class="senior-quiz-container">
            
            <!-- 실시간 치료비 할인 판넬 -->
            <div class="senior-quiz-calculator-panel" id="quiz-calculator-panel">
                <span class="senior-quiz-calc-title">📊 내 임플란트 견적 계산기</span>
                <div class="senior-quiz-price-flow">
                    <span class="senior-quiz-original-price" id="calc-orig-price" style="display: none;">개당 120만원</span>
                    <span class="senior-quiz-discount-arrow" id="calc-arrow" style="display: none;">➜</span>
                    <span class="senior-quiz-live-price waiting-state" id="calc-live-price">지원 혜택 조회 대기</span>
                </div>
                <span class="senior-quiz-discount-tag" id="calc-discount-tag">설문 진행 시 실시간 견적 확인 가능</span>
            </div>

            <!-- 토스 스타일 고신뢰성 화택 알림 배너 -->
            <div class="senior-quiz-toast-banner" id="quiz-toast-banner">
                <span class="senior-quiz-toast-check-icon">✓</span>
                <span id="toast-message">혜택이 적용되었습니다.</span>
            </div>

            <!-- 상단 진행 바 -->
            <div class="senior-quiz-progress-section">
                <span class="senior-quiz-progress-text" id="quiz-progress-text">1단계 / 3단계</span>
                <div class="senior-quiz-progress-bar-bg">
                    <div class="senior-quiz-progress-bar-fill" id="quiz-progress-bar-fill"></div>
                </div>
            </div>

            <!-- ================= STEP 1 ================= -->
            <div class="senior-quiz-step-content active" id="step-1">
                <h2 class="senior-quiz-question">내 진짜 임플란트 견적은?</h2>
                <p class="senior-quiz-subtitle">설문 진행 시 실시간 견적 확인 가능</p>
                <div class="senior-quiz-btn-list">
                    <button class="senior-quiz-choice-btn" onclick="selectStep1('senior')">
                        <div>
                            만 65세 이상 입니다.
                            <span class="senior-quiz-btn-subtext">임플란트 건강보험 70% 혜택 대상</span>
                        </div>
                        <span class="senior-quiz-btn-arrow">➜</span>
                    </button>
                    <button class="senior-quiz-choice-btn" onclick="selectStep1('general')">
                        <div>
                            만 65세 미만 입니다.
                            <span class="senior-quiz-btn-subtext">치과 비급여 파트너십 특가 적용</span>
                        </div>
                        <span class="senior-quiz-btn-arrow">➜</span>
                    </button>
                    <button class="senior-quiz-choice-btn unknown-option" onclick="selectStep1('unknown')">
                        <div>
                            나이를 잘 모르겠습니다.
                            <span class="senior-quiz-btn-subtext">상담 시 우대 혜택 조회 대기</span>
                        </div>
                        <span class="senior-quiz-btn-arrow">➜</span>
                    </button>
                </div>
            </div>

            <!-- ================= STEP 2 ================= -->
            <div class="senior-quiz-step-content" id="step-2">
                <h2 class="senior-quiz-question">추가 특별 지원금 쿠폰을 적용하시겠습니까?</h2>
                <p class="senior-quiz-subtitle">(오늘 신청자 한정 선착순 추가 할인)</p>
                <div class="senior-quiz-btn-list">
                    <button class="senior-quiz-choice-btn" onclick="selectStep2('apply')">
                        <div>
                            네, 지원금을 즉시 적용합니다.
                            <span class="senior-quiz-btn-subtext">선착순 추가 30만원 추가 감면</span>
                        </div>
                        <span class="senior-quiz-btn-arrow">➜</span>
                    </button>
                    <button class="senior-quiz-choice-btn unknown-option" onclick="selectStep2('unknown')">
                        <div>
                            잘 모름 (상담 시 안내 요청)
                            <span class="senior-quiz-btn-subtext">일단 임시 특별가 혜택 적용</span>
                        </div>
                        <span class="senior-quiz-btn-arrow">➜</span>
                    </button>
                </div>
            </div>

            <!-- ================= STEP 3 (FINAL FORM) ================= -->
            <div class="senior-quiz-step-content" id="step-3">
                <h2 class="senior-quiz-question">최종 할인 혜택 보장 신청</h2>
                <div class="senior-quiz-final-box">
                    <span class="senior-quiz-final-price-label" id="final-price-label">평균가</span>
                    <span class="senior-quiz-final-price" id="final-price-value">28만원</span>
                </div>
                
                <form id="senior-consultation-form" onsubmit="submitForm(event)">
                    <div class="senior-quiz-input-group">
                        <input type="text" id="user-name" class="senior-quiz-input-field" placeholder="성함을 입력하세요 (예: 홍길동)" required>
                        <input type="tel" id="user-phone" class="senior-quiz-input-field" placeholder="연락처를 입력하세요 (예: 01012345678)" required pattern="[0-9]{9,11}">
                    </div>
                    <button type="submit" class="senior-quiz-submit-btn" id="submit-btn-text">투명견적 무료 상담받기</button>
                </form>

                <div class="senior-quiz-trust-badge">
                    <span class="senior-quiz-lock-icon">🔒</span>
                    <span>개인정보는 맞춤 혜택 상담용으로만 안전하게 암호화 보관되며 스팸전화는 절대 걸지 않습니다. 상담 완료 후 즉시 안전하게 파기됩니다.</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        // 전역 퍼널 상태 데이터
        const funnelData = {
            step1Selection: null,
            step2Selection: null,
            originalPrice: 1200000,
            currentPrice: 1200000,
            discountApplied: 0,
            isFirstDiscount: true // 첫 감면 여부 (대기중 해제용)
        };

        // 실시간 숫자 카운트 애니메이션 함수
        function animatePriceChange(targetPrice, onComplete) {
            const priceEl = document.getElementById('calc-live-price');
            
            // 첫 번째 할인 시 대기중 텍스트 해제 및 일반가 120만원 노출
            if (funnelData.isFirstDiscount) {
                priceEl.classList.remove('waiting-state');
                document.getElementById('calc-orig-price').style.display = 'inline-block';
                document.getElementById('calc-arrow').style.display = 'inline-block';
                funnelData.isFirstDiscount = false;
            }

            const startPrice = funnelData.isFirstDiscount ? 1200000 : funnelData.currentPrice;
            const duration = 500; // ms
            const startTime = performance.now();
            
            priceEl.classList.add('price-animate');

            function updatePrice(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // EaseOutQuad 효과 적용
                const easeProgress = progress * (2 - progress);
                const currentVal = Math.round(startPrice + (targetPrice - startPrice) * easeProgress);
                
                priceEl.textContent = (currentVal / 10000).toFixed(0) + '만원';

                if (progress < 1) {
                    requestAnimationFrame(updatePrice);
                } else {
                    funnelData.currentPrice = targetPrice;
                    priceEl.classList.remove('price-animate');
                    if (onComplete) onComplete();
                }
            }

            requestAnimationFrame(updatePrice);
        }

        // 토스 스타일 프리미엄 알림 카드 실행 함수
        function showTossToast(message) {
            const toastEl = document.getElementById('quiz-toast-banner');
            const toastMsgEl = document.getElementById('toast-message');
            
            toastMsgEl.textContent = message;
            toastEl.style.display = 'flex';

            // 3초 후 페이드 아웃
            setTimeout(() => {
                toastEl.style.animation = 'slide-fade 0.4s ease-in reverse';
                setTimeout(() => {
                    toastEl.style.display = 'none';
                    toastEl.style.animation = 'slide-down-banner 0.4s ease-out forwards'; // 애니메이션 리셋
                }, 400);
            }, 3000);
        }

        // 1단계 선택 액션
        function selectStep1(option) {
            funnelData.step1Selection = option;
            let nextPrice = 1200000;
            let tagText = "";
            let toastText = "";

            if (option === 'senior') {
                nextPrice = 580000;
                tagText = "보험 혜택가 적용";
                toastText = "연령대별 건강보험 및 우대 혜택 적용 완료";
            } else if (option === 'general') {
                nextPrice = 790000;
                tagText = "비급여 특가 적용";
                toastText = "치과 파트너십 우대 혜택 적용 완료";
            } else { // unknown
                nextPrice = 790000;
                tagText = "임시 우대 적용";
                toastText = "임시 우대 혜택 적용 완료";
            }

            animatePriceChange(nextPrice, () => {
                showTossToast(toastText);
            });
            document.getElementById('calc-discount-tag').textContent = tagText;

            // 로깅 및 스텝 전환
            logStepTransition(1, 2, option);
            setTimeout(() => transitionToStep(2), 600); // 토스트 확인 후 부드럽게 넘어가도록 딜레이
        }

        // 2단계 선택 액션
        function selectStep2(option) {
            funnelData.step2Selection = option;
            let finalPrice = funnelData.currentPrice;
            let tagText = "";
            let toastText = "";

            // 최종 혜택가는 사용자 요청에 따라 "28만원" 고정 타겟
            finalPrice = 280000; 
            tagText = "최종 혜택 특별가";
            toastText = "지원금 쿠폰 적용 완료: 최종 견적가 산출";

            animatePriceChange(finalPrice, () => {
                showTossToast(toastText);
            });
            document.getElementById('calc-discount-tag').textContent = tagText;

            // 최종 페이지(Step 3) 텍스트 업데이트
            setTimeout(() => {
                document.getElementById('final-price-value').textContent = '28만원';
            }, 300);

            // 로깅 및 스텝 전환
            logStepTransition(2, 3, option);
            setTimeout(() => transitionToStep(3), 600);
        }

        // 스텝 전환 처리 함수
        function transitionToStep(stepNum) {
            // 모든 스텝 비활성화
            document.querySelectorAll('.senior-quiz-step-content').forEach(step => {
                step.classList.remove('active');
            });

            // 타겟 스텝 활성화
            document.getElementById(`step-${stepNum}`).classList.add('active');

            // 진행 상태 및 바 변경
            document.getElementById('quiz-progress-text').textContent = stepNum + '단계 / 3단계';
            const progressFill = document.getElementById('quiz-progress-bar-fill');
            if (stepNum === 1) progressFill.style.width = '33%';
            else if (stepNum === 2) progressFill.style.width = '66%';
            else if (stepNum === 3) progressFill.style.width = '100%';
        }

        // 최종 폼 서브밋 액션
        function submitForm(e) {
            e.preventDefault();
            const name = document.getElementById('user-name').value;
            const phone = document.getElementById('user-phone').value;

            // 로깅
            console.log(`[Form Submit] 성함: ${name}, 연락처: ${phone}, 최종선택: Step1=${funnelData.step1Selection}, Step2=${funnelData.step2Selection}, 최종혜택가=${funnelData.currentPrice}`);

            // GA4 Custom Event 전송 예시 (아임웹 연동용)
            if (typeof gtag === 'function') {
                gtag('event', 'lead_quiz_submit', {
                    'step1_age': funnelData.step1Selection,
                    'step2_coupon': funnelData.step2Selection,
                    'estimated_price': funnelData.currentPrice,
                    'user_name': name
                });
            }

            alert(`🎉 예상 혜택가(${document.getElementById('final-price-value').textContent})로 상담 신청이 접수되었습니다.\n담당자가 빠른 시일 내에 연락드리겠습니다.`);
        }

        // 전환 추적 로깅 (토스가 가장 선호하는 데이터 수집 훅)
        function logStepTransition(fromStep, toStep, selectedOption) {
            const logMsg = `[Funnel Track] Step ${fromStep} -> Step ${toStep} | 선택값: ${selectedOption} | 현재가: ${funnelData.currentPrice}원`;
            console.log(logMsg);

            // GA4 맞춤 이벤트 전송 훅 (아임웹에 GA4 활성화 시 바로 집계됨)
            if (typeof gtag === 'function') {
                gtag('event', `quiz_step_${fromStep}_to_${toStep}`, {
                    'selected_option': selectedOption,
                    'estimated_price': funnelData.currentPrice
                });
            }
        }
    </script>
</body>
</html>
