<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:'Pretendard';src:url('https://fastly.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Bold.woff') format('woff');font-weight:700}
  @font-face{font-family:'Pretendard';src:url('https://fastly.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-ExtraBold.woff') format('woff');font-weight:800}
  @font-face{font-family:'Pretendard';src:url('https://fastly.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Regular.woff') format('woff');font-weight:400}
  @font-face{font-family:'Pretendard';src:url('https://fastly.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Medium.woff') format('woff');font-weight:500}

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#f8fafb}
  body{
    font-family:'Pretendard','Noto Sans KR',sans-serif;
    color:#222;-webkit-font-smoothing:antialiased;
  }

  .lp{
    max-width:560px;margin:0 auto;
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;
    justify-content:center;align-items:center;
    padding:24px 24px 20px;
  }

  .wrap{
    width:100%;
    display:flex;flex-direction:column;
    justify-content:center;align-items:center;
  }

  /* 상단 뱃지 */
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    background:#f0fdf4;border:1px solid #d1fae5;
    color:#059669;font-size:14px;font-weight:700;
    padding:6px 16px;border-radius:8px;
    margin-bottom:14px;letter-spacing:-.3px;
  }

  /* 헤드카피 */
  .headline{text-align:center;margin-bottom:14px}
  .headline h1{font-size:26px;font-weight:900;color:#111;line-height:1.45;letter-spacing:-.8px;word-break:keep-all}
  .headline h1 .hook{display:inline-block;font-size:15px;font-weight:700;color:#fff;background:#059669;padding:4px 14px;border-radius:8px;margin-bottom:6px;letter-spacing:-.3px}
  .headline h1 .price{font-family:'Montserrat',sans-serif;font-size:52px;font-weight:900;color:#059669;letter-spacing:-2px}
  .headline h1 .price small{font-size:22px;font-weight:700}
  .headline h1 .sub{display:block;font-size:18px;font-weight:600;color:#666;margin-top:2px}

  /* 신뢰 배지 */
  .trust{
    display:flex;justify-content:center;gap:8px;margin-bottom:16px;width:100%;
  }
  .trust-chip{
    flex:1;text-align:center;
    background:#fff;border:1px solid #e5e7eb;border-radius:10px;
    padding:8px 4px;
  }
  .trust-chip .val{font-family:'Montserrat',sans-serif;font-size:15px;font-weight:900;color:#059669;display:block;line-height:1.1}
  .trust-chip .lbl{font-size:10px;color:#888;font-weight:500;margin-top:2px}

  /* 실시간 피드 (2줄) */
  .live-feed{
    width:100%;background:#fff;border:1px solid #e5e7eb;border-radius:10px;
    padding:10px 14px;margin-bottom:16px;
  }
  .live-feed-header{display:flex;align-items:center;gap:5px;margin-bottom:8px}
  .live-dot{width:5px;height:5px;background:#059669;border-radius:50%;animation:blink 1.5s infinite}
  .live-feed-header span{font-size:10px;color:#059669;font-weight:700;letter-spacing:-.2px}
  .live-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:5px 0;font-size:12px;color:#555;
    transition:opacity .3s,transform .3s;
  }
  .live-row:first-of-type{border-bottom:1px solid #f3f4f6}
  .live-row .name{font-weight:700;color:#333}
  .live-row .detail{color:#059669;font-weight:600;font-size:11px}
  .live-row .time{color:#bbb;font-size:10px;flex-shrink:0}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  /* CTA 버튼 */
  .cta-wrap{width:100%;margin-bottom:10px}
  .cta-btn{
    display:block;width:100%;padding:16px;
    background:#059669;color:#fff;
    font-size:17px;font-weight:800;letter-spacing:-.5px;
    border:none;border-radius:12px;cursor:pointer;
    font-family:'Pretendard',sans-serif;
    box-shadow:0 4px 16px rgba(5,150,105,.25);
    transition:all .2s;text-align:center;
    position:relative;overflow:hidden;
  }
  .cta-btn:active{transform:scale(.97)}
  .cta-btn .shimmer{
    position:absolute;top:0;left:-100%;width:60%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);
    animation:shimmer 3s ease-in-out infinite;pointer-events:none;
  }
  @keyframes shimmer{0%{left:-100%}50%{left:110%}100%{left:110%}}

  /* 폼 팝업 오버레이 */
  .form-overlay{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    z-index:10000;display:none;
    justify-content:center;align-items:center;
    padding:20px;
  }
  .form-overlay.open{display:flex}
  .form-popup{
    background:#fff;border-radius:20px;
    width:100%;max-width:400px;
    padding:28px 24px 24px;
    position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,.2);
    max-height:90vh;overflow-y:auto;
    animation:popupIn .3s ease;
  }
  @keyframes popupIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
  .form-popup-close{
    position:absolute;top:12px;right:14px;
    width:32px;height:32px;border-radius:50%;
    background:#f3f4f6;border:none;cursor:pointer;
    font-size:16px;color:#666;display:flex;align-items:center;justify-content:center;
    transition:background .15s;
  }
  .form-popup-close:hover{background:#e5e7eb}
  .form-popup-title{text-align:center;margin-bottom:4px;font-size:18px;font-weight:800;color:#111}
  .form-popup-sub{text-align:center;font-size:12px;color:#999;margin-bottom:16px}
  .form-area{width:100%;margin:0;padding:0}
  .form-inner-cta{width:100%;margin-top:10px}
  .form-submit-btn{
    display:block;width:100%;padding:16px;
    background:#059669;color:#fff;
    font-size:17px;font-weight:800;letter-spacing:-.5px;
    border:none;border-radius:12px;cursor:pointer;
    font-family:'Pretendard',sans-serif;
    box-shadow:0 4px 16px rgba(5,150,105,.25);
    text-align:center;position:relative;overflow:hidden;
  }
  .form-submit-btn:active{transform:scale(.97)}
  .form-submit-btn .shimmer{
    position:absolute;top:0;left:-100%;width:60%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);
    animation:shimmer 3s ease-in-out infinite;pointer-events:none;
  }

  /* 하단 안내 */
  .footer-trust{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:6px}
  .footer-trust span{font-size:10px;color:#aaa;letter-spacing:-.2px}

  /* 토스트 */
  .toast{
    position:fixed;bottom:16px;left:50%;
    transform:translateX(-50%) translateY(120%);
    background:#fff;border:1px solid #e5e7eb;border-radius:12px;
    padding:10px 14px;box-shadow:0 4px 20px rgba(0,0,0,.08);
    z-index:9999;max-width:300px;width:calc(100% - 40px);
    display:flex;align-items:center;gap:8px;
    opacity:0;transition:all .4s cubic-bezier(.16,1,.3,1);pointer-events:none;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .toast-dot{width:5px;height:5px;background:#059669;border-radius:50%;flex-shrink:0;animation:blink 1.5s infinite}
  .toast-text{font-size:11px;color:#333;line-height:1.4}
  .toast-text strong{color:#059669;font-weight:700}
  .toast-time{font-size:10px;color:#bbb;flex-shrink:0}

  /* 아임웹 폼 위젯 간격 강제 제거 + 중앙 정렬 */
  .widget-form,.w-section,[data-widget-type="form"],[data-widget-type]{margin-top:0!important;margin-bottom:0!important;padding-top:0!important;padding-bottom:0!important}
  /* 아임웹 섹션 간 간격 제거 */
  .widget-form-wrap,.section-element,.se-component{margin:0!important;padding:0!important}
  /* PC 중앙 정렬 강제 */
  .wrap{margin-left:auto!important;margin-right:auto!important}
  /* 아임웹 전체 래퍼 */
  #wrap,.container,.content-container{width:100%!important}
  .widget,[class*="widget-wrap"]{width:100%!important;max-width:100%!important;margin:0 auto!important;padding:0!important}

  @media(min-width:768px){
    .wrap{max-width:560px;padding:32px 40px 24px}
    .form-popup{max-width:460px}
  }
</style>
</head>
<body>

<div class="lp"><div class="wrap">

  <div class="badge">경기도민 전용 · 4월 한정</div>

  <div class="headline">
    <h1>
      <span class="hook">전국에서 찾아오는</span><br>
      임플란트 <span class="price">28<small>만원</small></span><br>
      <span class="sub">추가금 없이 확정가</span>
    </h1>
  </div>

  <div class="trust">
    <div class="trust-chip"><span class="val">28</span><span class="lbl">만원 확정</span></div>
    <div class="trust-chip"><span class="val">0</span><span class="lbl">원 추가금</span></div>
    <div class="trust-chip"><span class="val">10</span><span class="lbl">년 무상 A/S</span></div>
    <div class="trust-chip"><span class="val">1:1</span><span class="lbl">원장 전담</span></div>
  </div>

  <!-- 실시간 피드 2줄 -->
  <div class="live-feed">
    <div class="live-feed-header"><span class="live-dot"></span><span>실시간 견적 현황</span></div>
    <div class="live-row" id="liveRow1">
      <span><span class="name">김OO</span> 임플란트 2개 <span class="detail">56만원 확정</span></span>
      <span class="time">방금 전</span>
    </div>
    <div class="live-row" id="liveRow2">
      <span><span class="name">이OO</span> 임플란트 4개 <span class="detail">112만원 확정</span></span>
      <span class="time">2분 전</span>
    </div>
  </div>

  <!-- CTA 버튼 (클릭하면 폼 열림) -->
  <div class="cta-wrap" id="ctaWrap">
    <button type="button" class="cta-btn" id="ctaBtn">
      <span class="shimmer"></span>
      무료 견적 확인하기 →
    </button>
  </div>

  <div class="footer-trust">
    <span>🔒 개인정보 보호</span>
    <span>⚡ 즉시확인</span>
    <span>💬 24시간 내 연락</span>
  </div>

</div>

<!-- 폼 팝업 -->
<div class="form-overlay" id="formOverlay">
  <div class="form-popup">
    <button type="button" class="form-popup-close" id="formClose">&#10005;</button>
    <div class="form-popup-title">무료 견적 확인</div>
    <div class="form-popup-sub">이름과 연락처만 남겨주세요</div>
    <div class="form-area">
      <!-- 아임웹 입력폼 위젯 배치 -->
    </div>
    <div class="form-inner-cta" id="formInnerCta" style="display:none">
      <button type="button" class="form-submit-btn" id="formSubmitBtn">
        <span class="shimmer"></span>
        무료 견적 확인하기
      </button>
    </div>
  </div>
</div>

<!-- 토스트 -->
<div class="toast" id="toast">
  <span class="toast-dot"></span>
  <span class="toast-text" id="toastText"></span>
  <span class="toast-time" id="toastTime"></span>
</div>

<script>
(function(){
  // 폼 팝업 제어
  var ctaBtn=document.getElementById('ctaBtn');
  var formOverlay=document.getElementById('formOverlay');
  var formClose=document.getElementById('formClose');
  var FORM_ID_FOR_HIDE='w202602052340a9ba8a410';

  // 아임웹 폼 위젯을 팝업 안으로 이동
  function moveFormToPopup(){
    var fw=document.getElementById(FORM_ID_FOR_HIDE);
    if(fw){
      var widget=fw.closest('.widget-form')||fw.closest('[data-widget-type]')||fw.closest('.w-section')||fw;
      var formArea=formOverlay.querySelector('.form-area');
      if(formArea&&widget){
        formArea.appendChild(widget);
        widget.style.cssText='margin:0!important;padding:0!important;background:transparent!important';
      }
      return true;
    }
    return false;
  }
  var moveRetry=0;
  var moveInterval=setInterval(function(){
    if(moveFormToPopup()||moveRetry>30)clearInterval(moveInterval);
    moveRetry++;
  },500);

  // CTA 클릭 → 팝업 열기
  ctaBtn.addEventListener('click',function(){
    formOverlay.classList.add('open');
    // 이름 필드 포커스
    setTimeout(function(){
      var nameInp=formOverlay.querySelector('input[type="text"]');
      if(nameInp)nameInp.focus({preventScroll:true});
    },300);
  });

  // 닫기 버튼
  formClose.addEventListener('click',function(){
    formOverlay.classList.remove('open');
  });

  // 배경 클릭으로 닫기
  formOverlay.addEventListener('click',function(e){
    if(e.target===formOverlay)formOverlay.classList.remove('open');
  });

  // 실시간 피드 교체
  var names=['김','이','박','최','정','윤','장','한','오','서','홍','강','조','임','배'];
  var cities=['수원','용인','성남','안양','화성','고양','파주','김포','안산','시흥','광명','하남','평택','의정부'];
  var counts=[1,2,3,4,5,2,3,1,2,6];
  var times=['방금 전','1분 전','2분 전','3분 전'];
  var row1=document.getElementById('liveRow1'),row2=document.getElementById('liveRow2');
  var feedIdx=0;

  function makeFeedHTML(){
    var n=names[Math.floor(Math.random()*names.length)];
    var cnt=counts[Math.floor(Math.random()*counts.length)];
    var price=cnt*28;
    var t=times[Math.floor(Math.random()*times.length)];
    return {
      html:'<span><span class="name">'+n+'OO</span> 임플란트 '+cnt+'개 <span class="detail">'+price+'만원 확정</span></span><span class="time">'+t+'</span>',
    };
  }

  function replaceFeed(){
    var target=feedIdx===0?row1:row2;
    target.style.opacity='0';target.style.transform='translateY(-6px)';
    setTimeout(function(){
      var data=makeFeedHTML();
      target.innerHTML=data.html;
      target.style.opacity='1';target.style.transform='translateY(0)';
    },250);
    feedIdx=feedIdx===0?1:0;
  }
  function schedFeed(){setTimeout(function(){replaceFeed();schedFeed()},(5+Math.floor(Math.random()*6))*1000)}
  setTimeout(schedFeed,4000);

  // 토스트
  var toast=document.getElementById('toast'),toastText=document.getElementById('toastText'),toastTime=document.getElementById('toastTime');
  function showToast(){
    var n=names[Math.floor(Math.random()*names.length)];
    var c=cities[Math.floor(Math.random()*cities.length)];
    var cnt=counts[Math.floor(Math.random()*counts.length)];
    var price=cnt*28;
    var t=times[Math.floor(Math.random()*times.length)];
    toastText.innerHTML='<strong>'+n+'OO</strong>님('+c+') '+cnt+'개 <strong>'+price+'만원</strong> 확정';
    toastTime.textContent=t;
    toast.classList.add('show');
    setTimeout(function(){toast.classList.remove('show')},3500);
  }
  setTimeout(function(){showToast();function s(){setTimeout(function(){showToast();s()},(18+Math.floor(Math.random()*15))*1000)}s()},6000);

  // 아임웹 폼 커스터마이징
  var FORM_ID='w202602052340a9ba8a410';

  function customizeForm(){
    if(!FORM_ID)return false;
    var fw=document.getElementById(FORM_ID);if(!fw)return false;
    if(!document.getElementById('os-form-css')){
      var st=document.createElement('style');st.id='os-form-css';var F='#'+FORM_ID;
      st.textContent=
        F+','+F+' *{font-family:Pretendard,"Noto Sans KR",sans-serif!important}'+
        F+'{background:transparent!important;border:none!important;padding:0!important;max-width:100%!important;margin:0!important;box-shadow:none!important;width:100%!important}'+
        F+' form,'+F+' .form-inner,'+F+' .form-content{padding:0!important;margin:0!important;width:100%!important;background:transparent!important}'+
        F+' .form-group,'+F+' .field-wrap,'+F+' [class*="field"]{margin-bottom:10px!important}'+
        '.widget-form,.w-section,[data-widget-type]{background:transparent!important;margin:0!important;padding:0!important}'+
        F+' input[type="text"],'+F+' input[type="tel"],'+F+' input[type="email"],'+F+' textarea,'+F+' select{background:#fff!important;border:1.5px solid #d1d5db!important;border-radius:10px!important;color:#222!important;font-size:15px!important;padding:13px 12px!important;width:100%!important;outline:none!important;-webkit-appearance:none!important;transition:border-color .2s!important;margin:0!important}'+
        F+' input:focus{border-color:#059669!important;box-shadow:0 0 0 3px rgba(5,150,105,.08)!important}'+
        F+' input::placeholder{color:#bbb!important;font-size:13px!important}'+
        F+' label{color:#666!important;font-size:11px!important;font-weight:600!important;margin-bottom:4px!important;display:block!important;letter-spacing:-.2px!important}'+
        F+' button[type="submit"],'+F+' .wbtn,'+F+' [class*="submit"]{position:absolute!important;width:1px!important;height:1px!important;clip:rect(0,0,0,0)!important;opacity:0!important;pointer-events:none!important}'+
        
        '.lp-ph-row{display:flex;gap:4px;align-items:center;width:100%}'+
        '.lp-ph-010{background:#f0fdf4!important;border:1.5px solid #d1fae5!important;border-radius:8px!important;color:#059669!important;font-size:13px!important;font-weight:800!important;padding:13px 0!important;width:50px!important;min-width:50px!important;text-align:center!important;flex-shrink:0!important}'+
        '.lp-ph-dash{color:#ccc;font-size:12px;flex-shrink:0;margin:0 -1px}'+
        '.lp-ph-mid,.lp-ph-last{flex:1;min-width:0}'+
        '.lp-ph-mid input,.lp-ph-last input{text-align:center!important;font-size:16px!important;font-weight:600!important;letter-spacing:2px!important;padding:13px 4px!important;border-radius:8px!important}'+
        '.lp-agree-w{margin:6px 0 4px;display:flex;align-items:center;gap:5px;flex-wrap:nowrap}'+
        '.lp-agree-l{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:11px;color:#888;white-space:nowrap;flex-wrap:nowrap}'+
        '.lp-agree-cb{width:15px;height:15px;accent-color:#059669;cursor:pointer}'+
        '.lp-agree-tog{color:#059669;font-size:10px;cursor:pointer;white-space:nowrap;word-break:keep-all}'+
        '.lp-agree-det{display:none;margin:4px 0 8px;padding:10px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;font-size:10px;color:#999;line-height:1.7}'+
        '.lp-form-err{display:none;text-align:center;color:#EF4444;font-size:12px;font-weight:600;margin-top:6px;padding:8px;background:rgba(239,68,68,.04);border:1px solid rgba(239,68,68,.1);border-radius:8px}'+
        '@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}';
      document.head.appendChild(st);
    }

    // 개인정보 박스 숨김
    fw.querySelectorAll('textarea').forEach(function(el){el.style.cssText='display:none!important'});
    fw.querySelectorAll('div').forEach(function(el){
      if(el.querySelector('input[type="text"],input[type="tel"]'))return;
      var txt=(el.innerText||'').substring(0,200);
      if(txt.indexOf('수집 및 이용')>-1&&txt.length>50)el.style.cssText='display:none!important;height:0!important;overflow:hidden!important;margin:0!important;padding:0!important';
    });

    // 010 고정
    var ai=fw.querySelectorAll('input'),pi=[];
    ai.forEach(function(i){var n=(i.name||'').toLowerCase(),p=(i.placeholder||'').toLowerCase();if(n.indexOf('phone')>-1||n.indexOf('tel')>-1||p.indexOf('010')>-1||i.type==='tel')pi.push(i)});
    if(pi.length>=3){
      var p1=pi[0],p2=pi[1],p3=pi[2],pc=p1.closest('.form-group')||p1.parentNode;
      var row=document.createElement('div');row.className='lp-ph-row';
      var box=document.createElement('div');box.className='lp-ph-010';box.textContent='010';
      p1.value='010';p1.readOnly=true;p1.type='hidden';
      var d1=document.createElement('span');d1.className='lp-ph-dash';d1.textContent='-';
      var d2=document.createElement('span');d2.className='lp-ph-dash';d2.textContent='-';
      var mw=document.createElement('div');mw.className='lp-ph-mid';p2.placeholder='0000';p2.maxLength=4;p2.setAttribute('inputmode','numeric');mw.appendChild(p2);
      var lw=document.createElement('div');lw.className='lp-ph-last';p3.placeholder='0000';p3.maxLength=4;p3.setAttribute('inputmode','numeric');lw.appendChild(p3);
      row.appendChild(box);row.appendChild(d1);row.appendChild(mw);row.appendChild(d2);row.appendChild(lw);pc.appendChild(row);
      p2.addEventListener('input',function(){if(this.value.length>=4)p3.focus()});
    }

    // 원본 버튼 숨기기
    var sb=fw.querySelectorAll('button[type="submit"],input[type="submit"],.wbtn,[class*="submit"]'),ob=sb[0];
    sb.forEach(function(b){b.style.cssText='position:absolute!important;width:1px!important;height:1px!important;clip:rect(0,0,0,0)!important;opacity:0!important;pointer-events:none!important'});

    if(ob){
      var cbs=fw.querySelectorAll('input[type="checkbox"]');cbs.forEach(function(c){if(!c.closest('.lp-cta-sec')){var lb=c.closest('label')||c.parentNode;if(lb&&lb!==fw)lb.style.cssText='display:none!important;'}});

      // 동의 UI
      var aw=document.createElement('div');aw.className='lp-agree-w';
      aw.innerHTML='<label class="lp-agree-l"><input type="checkbox" class="lp-agree-cb" id="osAgreeCb"><span>개인정보 수집 및 이용 동의</span></label><span class="lp-agree-tog" id="osAgreeTog">[자세히]</span>';
      var err=document.createElement('div');err.className='lp-form-err';err.id='osFormErr';

      ob.parentNode.insertBefore(aw,ob);
      ob.parentNode.insertBefore(err,ob);

      // 폼 내부 제출 버튼 보이기
      var innerCta=document.getElementById('formInnerCta');
      if(innerCta)innerCta.style.display='block';

      document.getElementById('formSubmitBtn').addEventListener('click',function(){
        var vi=fw.querySelectorAll('input[type="text"]:not([type="hidden"]),input[type="tel"]:not([type="hidden"]),input:not([type])'),ef=[];
        vi.forEach(function(i){if(i.readOnly||i.type==='hidden'||!i.offsetParent)return;if(!i.value.trim())ef.push(i)});
        if(ef.length>0){ef.forEach(function(i){i.style.borderColor='#EF4444';i.style.boxShadow='0 0 0 3px rgba(239,68,68,.08)';setTimeout(function(){i.style.borderColor='';i.style.boxShadow=''},3000)});err.textContent='모든 항목을 입력해주세요';err.style.display='block';err.style.animation='shakeX .4s ease';ef[0].focus();setTimeout(function(){err.style.display='none'},4000);return}
        var ac=document.getElementById('osAgreeCb');if(ac&&!ac.checked){err.textContent='개인정보 수집 및 이용에 동의해주세요';err.style.display='block';return}
        err.style.display='none';ob.style.pointerEvents='auto';ob.click();ob.style.pointerEvents='none';
      });

      document.getElementById('osAgreeTog').addEventListener('click',function(){clearInterval(privInterval);var pe=fw.querySelector('div.form-control')||fw.querySelector('textarea');if(!pe)return;var vis=window.getComputedStyle(pe).display!=='none';if(vis){pe.style.cssText='display:none!important;';this.textContent='[자세히]'}else{pe.style.cssText='display:block!important;border:1px solid #ddd!important;padding:10px!important;height:100px!important;overflow-y:auto!important;margin:6px 0 10px!important;font-size:11px!important;color:#6B7280!important;line-height:1.8!important;border-radius:10px!important;background:#f9fafb!important;';var pp=pe.parentNode;while(pp&&pp!==fw){if(window.getComputedStyle(pp).display==='none')pp.style.display='block';pp=pp.parentNode}this.textContent='[접기]'}});
      document.getElementById('osAgreeCb').addEventListener('change',function(){var ch=this.checked;cbs.forEach(function(c){c.checked=ch})});
    }
    return true;
  }
  var fr=0,fi=setInterval(function(){if(customizeForm()||fr>30)clearInterval(fi);fr++},500);
})();
</script>
