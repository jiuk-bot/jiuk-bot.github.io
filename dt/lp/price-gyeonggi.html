<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Noto+Serif+KR:wght@500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/hero-surgery.jpg" fetchpriority="high">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{height:100%;background:#03081A}
  body{
    min-height:100%;
    background:#03081A;
    background-image:
      radial-gradient(ellipse at top,#0A152E 0%,#040A1C 55%,#02050F 100%);
    font-family:'Noto Sans KR',sans-serif;
    color:#F2F5FB;
    -webkit-font-smoothing:antialiased;
    font-weight:500;
    overflow-x:hidden;
  }

  .lp{
    max-width:960px;margin:0 auto;
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;
    align-items:center;
    padding:0 0 20px;
    position:relative;
  }
  .wrap{width:100%;display:flex;flex-direction:column;align-items:center}

  /* 히어로 */
  .hero{
    width:100%;position:relative;
    padding:8px 10px 14px;
    text-align:center;
    overflow:hidden;
    background:#06102A;
    border-bottom:1px solid rgba(255,255,255,.04);
  }
  .hero-img{
    position:absolute;top:0;left:0;width:100%;height:100%;
    object-fit:cover;object-position:center 30%;
    z-index:0;opacity:0;transition:opacity .4s;
    filter:saturate(.68) brightness(.68) hue-rotate(-22deg) contrast(1.1);
  }
  .hero-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:
      linear-gradient(180deg,
        rgba(3,8,26,.32) 0%,
        rgba(3,8,26,.5) 35%,
        rgba(3,8,26,.7) 58%,
        rgba(3,8,26,.92) 80%,
        #03081A 95%),
      radial-gradient(ellipse at center 35%,rgba(3,8,26,.05) 0%,rgba(3,8,26,.4) 78%);z-index:1;}
  .hero .badge,.hero .headline{position:relative;z-index:2}

  /* 뱃지 */
  .badge{
    display:inline-flex;align-items:center;gap:9px;
    background:rgba(91,127,255,.12);
    border:1.5px solid rgba(91,127,255,.45);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:#7B96FF;
    font-size:clamp(18px,4.2vw,26px);
    font-weight:900;letter-spacing:-.3px;
    padding:10px 22px;border-radius:32px;margin-bottom:8px;
    box-shadow:0 4px 18px rgba(0,0,0,.25);
  }
  .badge .dot{width:8px;height:8px;background:#5B7FFF;border-radius:50%;animation:blink 1.5s infinite;box-shadow:0 0 10px #5B7FFF}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  /* 헤드카피 */
  .headline{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
  .headline .hl-small{
    display:block;
    font-size:clamp(20px,4.6vw,32px);
    font-weight:500;color:#E8EEF8;
    letter-spacing:.2px;line-height:1.3;
    text-shadow:0 2px 10px rgba(0,0,0,.55);
    margin-bottom:0;
  }
  .headline .hl-main{
    display:block;
    font-family:'Noto Serif KR',serif;
    font-size:clamp(40px,11.6vw,94px);
    font-weight:700;color:#FFFFFF;
    letter-spacing:.5px;line-height:1.08;
    text-shadow:0 2px 14px rgba(0,0,0,.6);
    width:100%;padding:0 2px;
    white-space:nowrap;
  }
  .headline .price-row{
    display:flex;align-items:baseline;justify-content:center;
    gap:6px;margin:8px 0 0;
    white-space:nowrap;
  }
  .headline .price{
    font-family:'Montserrat',sans-serif;
    font-size:clamp(108px,28vw,220px);
    font-weight:800;
    color:#5B7FFF;letter-spacing:.005em;line-height:.95;
    text-shadow:0 4px 28px rgba(91,127,255,.45);
    background:linear-gradient(180deg,#7B96FF 0%,#5B7FFF 55%,#3D5FE8 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .headline .price-unit{
    font-family:'Noto Sans KR',sans-serif;
    font-size:clamp(54px,13vw,98px);
    font-weight:800;color:#5B7FFF;letter-spacing:.01em;
    background:linear-gradient(180deg,#7B96FF 0%,#5B7FFF 55%,#3D5FE8 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  /* 콘텐츠 영역 */
  .content{width:100%;padding:6px 14px 0;display:flex;flex-direction:column;align-items:center;gap:6px}

  /* 포인트 카드 */
  .points{width:100%;display:flex;flex-direction:column;gap:14px}
  .point{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    background:#0E1A33;
    border:1px solid rgba(255,255,255,.05);
    border-radius:18px;padding:22px 22px;
    box-shadow:0 4px 18px rgba(0,0,0,.35);
  }
  .point-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
  .point-title{
    font-size:clamp(26px,6.4vw,42px);
    font-weight:700;color:#FFFFFF;
    margin-bottom:0;letter-spacing:.3px;line-height:1.25;
    word-break:keep-all;
  }
  .point-title .em{color:#FFFFFF}
  .point-desc{
    font-size:clamp(16px,3.8vw,24px);
    font-weight:400;color:#9AA4BA;
    letter-spacing:.2px;line-height:1.45;word-break:keep-all;
  }
  .point-icon{
    font-size:clamp(68px,13vw,98px);
    flex-shrink:0;
    width:clamp(96px,20vw,140px);height:clamp(96px,20vw,140px);
    display:flex;align-items:center;justify-content:center;
    background:transparent;
    border:none;
    border-radius:14px;
  }

  /* 타이핑 애니메이션 */
  .typing-bar{
    width:100%;text-align:center;
    font-size:clamp(17px,4vw,24px);
    font-weight:800;color:#C6FF3D;
    min-height:26px;letter-spacing:.3px;
    margin-top:4px;
    text-shadow:0 0 14px rgba(198,255,61,.6),0 0 28px rgba(198,255,61,.3);
  }
  .typing-bar .cursor{animation:cursorBlink .7s infinite}
  @keyframes cursorBlink{0%,100%{opacity:1}50%{opacity:0}}

  /* CTA 버튼 */
  .cta-wrap{width:100%}
  .cta-btn{
    display:block;width:100%;padding:16px;
    background:linear-gradient(135deg,#7B96FF 0%,#5B7FFF 50%,#3D5FE8 100%);
    color:#FFFFFF;
    font-size:clamp(20px,4.8vw,28px);
    font-weight:700;letter-spacing:-.2px;
    border:none;border-radius:60px;cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
    box-shadow:0 8px 28px rgba(91,127,255,.4),0 2px 8px rgba(0,0,0,.3);
    text-align:center;position:relative;overflow:hidden;
    transition:all .2s;
  }
  .cta-btn:active{transform:scale(.97)}
  .cta-btn .shimmer{
    position:absolute;top:0;left:-100%;width:60%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
    animation:shimmer 3s ease-in-out infinite;pointer-events:none;
  }
  @keyframes shimmer{0%{left:-100%}50%{left:110%}100%{left:110%}}

  /* 폼 팝업 (바텀시트) */
  .form-overlay{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(4,11,28,.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    z-index:9998;opacity:0;pointer-events:none;
    transition:opacity .3s;
  }
  .form-overlay.open{opacity:1;pointer-events:auto}

  .form-popup{
    position:fixed;bottom:0;left:0;width:100%;
    z-index:9999;
    transform:translateY(100%);
    transition:transform .35s cubic-bezier(.16,1,.3,1);
  }
  .form-popup.open{transform:translateY(0)}

  .form-card{
    position:relative;
    max-width:720px;margin:0 auto;
    background:#0B1429;
    border-top:1px solid rgba(255,255,255,.06);
    border-radius:26px 26px 0 0;
    padding:20px 22px 22px;
    box-shadow:0 -10px 50px rgba(0,0,0,.6);
    max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .form-handle{width:44px;height:5px;background:rgba(91,127,255,.4);border-radius:3px;margin:0 auto 10px}
  .form-close{
    position:absolute;top:18px;right:20px;
    width:38px;height:38px;border:none;
    background:rgba(255,255,255,.06);border-radius:50%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;color:#C9D6E8;transition:all .2s;z-index:1;
  }
  .form-close:hover{background:rgba(255,255,255,.12);color:#FFFFFF}
  .form-title{text-align:center;font-size:19px;font-weight:900;color:#FFFFFF;margin-bottom:3px;letter-spacing:-.5px}
  .form-sub{text-align:center;font-size:14px;color:#B8C5D9;margin-bottom:12px;font-weight:600}
  .form-area{width:100%}
  .form-inner-cta{
    width:100%;display:none;
    position:sticky;bottom:0;
    padding:10px 0 4px;margin-top:10px;
    background:linear-gradient(to top,#0B1429 65%,rgba(11,20,41,0) 100%);
    z-index:3;
  }
  .form-btn{
    display:block;width:100%;padding:14px;
    background:linear-gradient(135deg,#7B96FF 0%,#5B7FFF 50%,#3D5FE8 100%);
    color:#0A1F40;
    font-size:18px;font-weight:900;letter-spacing:-.5px;
    border:none;border-radius:50px;cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
    box-shadow:0 8px 24px rgba(91,127,255,.35);
    text-align:center;position:relative;overflow:hidden;
  }
  .form-btn .shimmer{
    position:absolute;top:0;left:-100%;width:60%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
    animation:shimmer 3s ease-in-out infinite;pointer-events:none;
  }
  .form-btn:active{transform:scale(.97)}

  /* 약관 동의 모달 (v4 신규) */
  .agree-overlay{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(4,11,28,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    z-index:10000;opacity:0;pointer-events:none;
    transition:opacity .25s;
  }
  .agree-overlay.open{opacity:1;pointer-events:auto}
  .agree-modal{
    position:fixed;top:50%;left:50%;
    transform:translate(-50%,-45%) scale(.95);
    width:calc(100% - 32px);max-width:480px;
    z-index:10001;opacity:0;pointer-events:none;
    transition:opacity .25s,transform .3s cubic-bezier(.16,1,.3,1);
  }
  .agree-modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .agree-card{
    background:#FFFFFF;
    border-radius:18px;
    padding:28px 22px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    text-align:center;
  }
  .agree-title{
    font-size:18px;font-weight:900;color:#1A2238;
    letter-spacing:-.4px;line-height:1.4;margin-bottom:6px;
  }
  .agree-warn{
    font-size:13px;font-weight:500;color:#6B7280;
    line-height:1.5;margin-bottom:18px;
  }
  .agree-link{
    display:flex;align-items:center;justify-content:flex-start;
    gap:6px;font-size:14px;color:#1A2238;font-weight:600;
    padding:0 4px;margin-bottom:14px;
    text-align:left;
  }
  .agree-link .agree-detail-toggle{
    color:#5B7FFF;text-decoration:underline;cursor:pointer;font-weight:700;
  }
  .agree-detail-box{
    display:none;text-align:left;
    background:#F3F4F6;border:1px solid #E5E7EB;border-radius:10px;
    padding:12px 14px;margin-bottom:14px;
    font-size:12px;color:#475569;line-height:1.7;
    max-height:160px;overflow-y:auto;
  }
  .agree-detail-box.open{display:block}
  .agree-btn{
    display:block;width:100%;padding:16px;
    background:linear-gradient(135deg,#7B96FF 0%,#5B7FFF 50%,#3D5FE8 100%);
    color:#FFFFFF;
    font-size:17px;font-weight:800;letter-spacing:-.3px;
    border:none;border-radius:12px;cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
    box-shadow:0 6px 20px rgba(91,127,255,.4);
    text-align:center;position:relative;overflow:hidden;
  }
  .agree-btn:active{transform:scale(.97)}
  .agree-btn .shimmer{
    position:absolute;top:0;left:-100%;width:60%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
    animation:shimmer 3s ease-in-out infinite;pointer-events:none;
  }
  .agree-close{
    position:absolute;top:14px;right:14px;
    width:30px;height:30px;border:none;
    background:#F3F4F6;border-radius:50%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;color:#6B7280;
  }

  /* 하단 */
  .footer-trust{
    display:flex;align-items:center;justify-content:center;
    gap:12px;flex-wrap:wrap;margin-top:0;
  }
  .footer-trust span{font-size:13px;color:#8A95AB;font-weight:500}

  /* 아임웹 오버라이드 */
  .widget-form,.w-section,[data-widget-type="form"],[data-widget-type]{margin-top:0!important;margin-bottom:0!important;padding-top:0!important;padding-bottom:0!important}
  .widget-form-wrap,.section-element,.se-component{margin:0!important;padding:0!important}
  #wrap,.container,.content-container{width:100%!important}
  .widget,[class*="widget-wrap"]{width:100%!important;max-width:100%!important;margin:0 auto!important;padding:0!important}

  @media(min-width:768px){
    .content{max-width:960px;padding:10px 40px 0}
    .hero{padding:14px 40px 18px}
    .point{padding:28px 32px}
    .points{gap:18px}
  }

  /* 스티키 CTA */
  .sticky-cta{
    position:fixed;bottom:0;left:0;right:0;
    z-index:9990;
    padding:12px 16px 16px;
    background:rgba(3,8,26,.95);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid rgba(255,255,255,.05);
    box-shadow:0 -6px 24px rgba(0,0,0,.5);
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.16,1,.3,1);
  }
  .sticky-cta.show{transform:translateY(0)}
  .sticky-cta-inner{max-width:960px;margin:0 auto}
  .sticky-cta-btn{
    display:block;width:100%;padding:18px;
    background:linear-gradient(135deg,#7B96FF 0%,#5B7FFF 50%,#3D5FE8 100%);
    color:#0A1F40;
    font-size:20px;font-weight:900;letter-spacing:-.5px;
    border:none;border-radius:50px;cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
    box-shadow:0 6px 20px rgba(91,127,255,.4);
    text-align:center;position:relative;overflow:hidden;
  }
  .sticky-cta-btn:active{transform:scale(.97)}
  .sticky-cta-btn .shimmer{position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shimmer 3s ease-in-out infinite;pointer-events:none}
</style>
</head>
<body>

<div class="lp"><div class="wrap">

  <!-- 히어로 -->
  <div class="hero">
    <img src="img/hero-surgery.jpg" alt="" class="hero-img" fetchpriority="high" decoding="async" onload="this.style.opacity=1">
    <div class="hero-overlay"></div>
    <div class="headline">
      <h1>
        <span class="hl-small">식립개수 상관없이!</span>
        <span class="hl-main">국산정품 임플란트</span>
      </h1>
      <div class="price-row">
        <span class="price">28</span>
        <span class="price-unit">만원</span>
      </div>
    </div>
  </div>

  <div class="content">

    <div class="points">
      <div class="point">
        <div class="point-info">
          <div class="point-title">추가금 0원</div>
          <div class="point-desc">표시 가격 외 추가 비용 없음</div>
        </div>
        <div class="point-icon">&#128176;</div>
      </div>
      <div class="point">
        <div class="point-info">
          <div class="point-title">과잉진료 NO</div>
          <div class="point-desc">필요한 치료만 정확하게</div>
        </div>
        <div class="point-icon">&#9878;&#65039;</div>
      </div>
      <div class="point">
        <div class="point-info">
          <div class="point-title">10년 무상 A/S</div>
          <div class="point-desc">치료 후 책임지는 사후관리</div>
        </div>
        <div class="point-icon">&#128737;&#65039;</div>
      </div>
    </div>

    <div class="typing-bar" id="typingBar"></div>

    <!-- CTA 버튼 -->
    <div class="cta-wrap">
      <button type="button" class="cta-btn" id="ctaBtn">
        <span class="shimmer"></span>
        무료 상담 신청하기 &#8594;
      </button>
    </div>

    <div class="footer-trust">
      <span>&#128274; 개인정보 보호</span>
      <span>&#9889; 즉시 확인</span>
      <span>&#128172; 24시간 내 연락</span>
    </div>

  </div>
</div></div>

<!-- 폼 팝업 (바텀시트) -->
<div class="form-overlay" id="formOverlay"></div>
<div class="form-popup" id="formPopup">
  <div class="form-card">
    <div class="form-handle"></div>
    <button type="button" class="form-close" id="formClose">&times;</button>
    <div class="form-title">30초 간편 상담신청</div>
    <div class="form-sub">이름과 연락처만 남겨주세요</div>
    <div class="form-area" id="formArea">
      <!-- 아임웹 입력폼 위젯 배치 -->
    </div>
    <div class="form-inner-cta" id="formInnerCta">
      <button type="button" class="form-btn" id="formBtn">
        <span class="shimmer"></span>
        무료 상담 받기
      </button>
    </div>
  </div>
</div>

<!-- 약관 동의 모달 (v4 신규: 2단계 진입 패턴) -->
<div class="agree-overlay" id="agreeOverlay"></div>
<div class="agree-modal" id="agreeModal">
  <div class="agree-card">
    <button type="button" class="agree-close" id="agreeClose">&times;</button>
    <div class="agree-title">상담을 위해 약관에 동의해주세요.</div>
    <div class="agree-warn">(타인 번호 도용 시 법적 처벌을 받을 수 있습니다.)</div>
    <div class="agree-link">
      <span>개인정보취급방침동의</span>
      <span class="agree-detail-toggle" id="agreeDetailToggle">[자세히보기]</span>
    </div>
    <div class="agree-detail-box" id="agreeDetailBox"></div>
    <button type="button" class="agree-btn" id="agreeBtn">
      <span class="shimmer"></span>
      동의하고 상담 신청
    </button>
  </div>
</div>

<script>
(function(){
  var FORM_ID='w202602052340a9ba8a410';

  // CTA 버튼 → 폼 팝업 토글
  var ctaBtn=document.getElementById('ctaBtn');
  var formOverlay=document.getElementById('formOverlay');
  var formPopup=document.getElementById('formPopup');

  function openForm(){
    formOverlay.classList.add('open');
    formPopup.classList.add('open');
    document.body.style.overflow='hidden';if(stickyCta)stickyCta.classList.remove('show');
    setTimeout(function(){
      var nameInp=formPopup.querySelector('input[type="text"]');
      if(nameInp)nameInp.focus({preventScroll:true});
    },350);
  }
  function closeForm(){
    formOverlay.classList.remove('open');
    formPopup.classList.remove('open');
    formPopup.style.bottom='';document.body.style.overflow='';if(stickyCta)stickyCta.classList.add('show');
  }

  ctaBtn.addEventListener('click',openForm);

  // 모바일 키보드 대응 (visualViewport + active input scroll)
  var formCard=formPopup.querySelector('.form-card');
  function ensureInputVisible(inp){
    if(!inp)return;
    setTimeout(function(){
      try{inp.scrollIntoView({block:'center',behavior:'smooth'});}
      catch(e){inp.scrollIntoView(false);}
    },320);
  }
  if(window.visualViewport){
    var vv=window.visualViewport;
    function adjustForKeyboard(){
      if(!formPopup.classList.contains('open')){formPopup.style.bottom='';if(formCard)formCard.style.maxHeight='90vh';return}
      var kb=window.innerHeight-vv.height-vv.offsetTop;
      if(kb>80){
        formPopup.style.bottom=kb+'px';
        if(formCard)formCard.style.maxHeight=(vv.height-20)+'px';
        var ae=document.activeElement;
        if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))ensureInputVisible(ae);
      }else{
        formPopup.style.bottom='';
        if(formCard)formCard.style.maxHeight='90vh';
      }
    }
    vv.addEventListener('resize',adjustForKeyboard);
    vv.addEventListener('scroll',adjustForKeyboard);
  }
  // 폼 안 input focus 시 키보드 위로 자동 스크롤
  document.addEventListener('focusin',function(e){
    if(!formPopup.classList.contains('open'))return;
    var t=e.target;if(!t||(t.tagName!=='INPUT'&&t.tagName!=='TEXTAREA'))return;
    if(t.type==='hidden'||t.type==='checkbox'||t.type==='radio')return;
    ensureInputVisible(t);
  });

  formOverlay.addEventListener('click',closeForm);
  document.getElementById('formClose').addEventListener('click',closeForm);

  // 약관 모달 제어 (v4 신규)
  var agreeOverlay=document.getElementById('agreeOverlay');
  var agreeModal=document.getElementById('agreeModal');
  function openAgree(){
    agreeOverlay.classList.add('open');
    agreeModal.classList.add('open');
  }
  function closeAgree(){
    agreeOverlay.classList.remove('open');
    agreeModal.classList.remove('open');
    var box=document.getElementById('agreeDetailBox');
    if(box){box.classList.remove('open');}
    var tog=document.getElementById('agreeDetailToggle');
    if(tog)tog.textContent='[자세히보기]';
  }
  agreeOverlay.addEventListener('click',closeAgree);
  document.getElementById('agreeClose').addEventListener('click',closeAgree);

  // 아임웹 폼에 설정된 약관 텍스트 그대로 추출 (사용자 설정 원본 보존)
  function injectPrivacyText(){
    var box=document.getElementById('agreeDetailBox');
    if(!box||box.dataset.lpInjected==='1')return;
    var fw=document.getElementById(FORM_ID);if(!fw)return;
    var src=fw.querySelector('textarea');
    var txt='';
    if(src&&(src.value||'').length>0){
      txt=src.value;
    }else{
      var ctl=fw.querySelector('div.form-control');
      if(ctl)txt=ctl.innerText||ctl.textContent||'';
    }
    if(txt){
      box.textContent=txt;
      box.style.whiteSpace='pre-wrap';
      box.dataset.lpInjected='1';
    }
  }

  document.getElementById('agreeDetailToggle').addEventListener('click',function(){
    injectPrivacyText();
    var box=document.getElementById('agreeDetailBox');
    if(box.classList.contains('open')){box.classList.remove('open');this.textContent='[자세히보기]';}
    else{box.classList.add('open');this.textContent='[접기]';}
  });

  // 타이핑 애니메이션
  var msgs=['지금 선착순 혜택 받으세요!','국산정품 임플란트 28만원','이번 달 한정 확정가 안내'];
  var typingBar=document.getElementById('typingBar');
  var msgIdx=0,charIdx=0,deleting=false;
  function typeLoop(){
    var msg=msgs[msgIdx];
    if(!deleting){
      charIdx++;
      typingBar.innerHTML=msg.substring(0,charIdx)+'<span class="cursor">|</span>';
      if(charIdx>=msg.length){setTimeout(function(){deleting=true;typeLoop()},2000);return}
      setTimeout(typeLoop,80);
    }else{
      charIdx--;
      typingBar.innerHTML=msg.substring(0,charIdx)+'<span class="cursor">|</span>';
      if(charIdx<=0){deleting=false;msgIdx=(msgIdx+1)%msgs.length;setTimeout(typeLoop,400);return}
      setTimeout(typeLoop,40);
    }
  }
  typeLoop();

  // 아임웹 폼 이동
  function moveForm(){
    var fw=document.getElementById(FORM_ID);
    if(fw){
      var widget=fw.closest('.widget-form')||fw.closest('[data-widget-type]')||fw.closest('.w-section')||fw;
      var area=document.getElementById('formArea');
      if(area&&widget){
        area.appendChild(widget);
        widget.style.cssText='margin:0!important;padding:0!important;background:transparent!important';
      }
      return true;
    }
    return false;
  }
  var mr=0,mi=setInterval(function(){if(moveForm()||mr>30)clearInterval(mi);mr++},500);

  // 개인정보 텍스트 + 체크박스 숨기기 (폼 안에는 절대 노출 안 함)
  function hidePrivacy(){
    var fw=document.getElementById(FORM_ID)||document.querySelector('.widget-form')||document.querySelector('[data-widget-type="form"]');
    if(!fw)return;
    fw.querySelectorAll('textarea').forEach(function(el){el.style.cssText='display:none!important'});
    fw.querySelectorAll('input[type="checkbox"]').forEach(function(c){
      var lb=c.closest('label')||c.parentNode;
      if(lb&&lb!==fw)lb.style.cssText='display:none!important';
      c.style.cssText='display:none!important';
    });
    fw.querySelectorAll('div').forEach(function(el){
      if(el.querySelector('input[type="text"],input[type="tel"],input[type="email"]'))return;
      var txt=(el.innerText||'').substring(0,300);
      if(txt.indexOf('수집 및 이용')>-1&&txt.length>50)el.style.cssText='display:none!important;height:0!important;overflow:hidden!important;margin:0!important;padding:0!important';
    });
  }
  var pr=0,pi=setInterval(function(){hidePrivacy();pr++;if(pr>20)clearInterval(pi)},800);

  // 폼 커스터마이징
  function customizeForm(){
    var fw=document.getElementById(FORM_ID);if(!fw)return false;
    hidePrivacy();

    if(!document.getElementById('ic-form-css')){
      var st=document.createElement('style');st.id='ic-form-css';var F='#'+FORM_ID;
      st.textContent=
        F+','+F+' *{font-family:"Noto Sans KR",sans-serif!important}'+
        F+'{background:transparent!important;border:none!important;padding:0!important;max-width:100%!important;margin:0!important;box-shadow:none!important;width:100%!important}'+
        F+' form,'+F+' .form-inner,'+F+' .form-content{padding:0!important;margin:0!important;width:100%!important;background:transparent!important}'+
        F+' .form-group,'+F+' .field-wrap,'+F+' [class*="field"]{margin-bottom:10px!important}'+
        '.widget-form,.w-section,[data-widget-type]{background:transparent!important;margin:0!important;padding:0!important}'+
        F+' input[type="text"],'+F+' input[type="tel"],'+F+' input[type="email"],'+F+' select{background:rgba(255,255,255,.06)!important;border:1.5px solid rgba(91,127,255,.3)!important;border-radius:10px!important;color:#FFFFFF!important;-webkit-text-fill-color:#FFFFFF!important;caret-color:#FFFFFF!important;font-size:16px!important;padding:13px 12px!important;width:100%!important;outline:none!important;-webkit-appearance:none!important;transition:border-color .2s!important;margin:0!important}'+
        F+' input:focus{border-color:#5B7FFF!important;box-shadow:0 0 0 3px rgba(91,127,255,.18)!important}'+
        F+' input::placeholder{color:#8A95AB!important;font-size:16px!important}'+
        F+' label{color:#C9D6E8!important;font-size:15px!important;font-weight:700!important;margin-bottom:6px!important;display:block!important}'+
        F+' button[type="submit"],'+F+' .wbtn,'+F+' [class*="submit"]{position:absolute!important;width:1px!important;height:1px!important;clip:rect(0,0,0,0)!important;opacity:0!important;pointer-events:none!important}'+
        F+' textarea{display:none!important}'+

        '.lp-ph-row{display:flex;gap:6px;align-items:center;width:100%}'+
        '.lp-ph-010{background:rgba(91,127,255,.12)!important;border:1.5px solid rgba(91,127,255,.4)!important;border-radius:10px!important;color:#7B96FF!important;font-size:17px!important;font-weight:800!important;padding:13px 0!important;width:54px!important;min-width:60px!important;text-align:center!important;flex-shrink:0!important}'+
        '.lp-ph-dash{color:#8A95AB;font-size:14px;flex-shrink:0}'+
        '.lp-ph-mid,.lp-ph-last{flex:1;min-width:0;background:rgba(255,255,255,.06)!important;border:1.5px solid rgba(91,127,255,.3)!important;border-radius:10px!important;transition:border-color .2s,box-shadow .2s!important}'+'.lp-ph-mid:focus-within,.lp-ph-last:focus-within{border-color:#5B7FFF!important;box-shadow:0 0 0 3px rgba(91,127,255,.18)!important}'+
        '.lp-ph-mid input,.lp-ph-last input{text-align:center!important;font-size:19px!important;font-weight:600!important;letter-spacing:3px!important;padding:13px 4px!important;border:none!important;background:transparent!important;background-color:transparent!important;color:#FFFFFF!important;-webkit-text-fill-color:#FFFFFF!important;caret-color:#FFFFFF!important;outline:none!important;box-shadow:none!important;width:100%!important}'+

        '.lp-form-err{display:none;text-align:center;color:#FF8A8A;font-size:15px;font-weight:700;margin-top:10px;padding:11px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px}'+
        F+' input:-webkit-autofill,'+F+' input:-webkit-autofill:hover,'+F+' input:-webkit-autofill:focus,'+F+' input:-webkit-autofill:active{-webkit-text-fill-color:#FFFFFF!important;-webkit-box-shadow:0 0 0 1000px rgba(255,255,255,.06) inset!important;box-shadow:0 0 0 1000px rgba(255,255,255,.06) inset!important;caret-color:#FFFFFF!important;transition:background-color 9999s ease-in-out 0s!important;font-weight:600!important;color:#FFFFFF!important}'+
        '@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}';
      document.head.appendChild(st);
    }

    // 010 고정
    var ai=fw.querySelectorAll('input'),pis=[];
    ai.forEach(function(i){var n=(i.name||'').toLowerCase(),p=(i.placeholder||'').toLowerCase();if(n.indexOf('phone')>-1||n.indexOf('tel')>-1||n.indexOf('hp')>-1||p.indexOf('연락')>-1||p.indexOf('전화')>-1||p.indexOf('010')>-1||i.type==='tel')pis.push(i)});
    if(pis.length>=3&&!fw.querySelector('.lp-ph-row')){
      var p1=pis[0],p2=pis[1],p3=pis[2],pc=p1.closest('.form-group')||p1.closest('[class*="field"]')||p1.parentNode;
      var row=document.createElement('div');row.className='lp-ph-row';
      var box=document.createElement('div');box.className='lp-ph-010';box.textContent='010';
      p1.value='010';p1.readOnly=true;p1.type='hidden';
      var d1=document.createElement('span');d1.className='lp-ph-dash';d1.textContent='-';
      var d2=document.createElement('span');d2.className='lp-ph-dash';d2.textContent='-';
      var mw=document.createElement('div');mw.className='lp-ph-mid';p2.placeholder='0000';p2.maxLength=4;p2.setAttribute('inputmode','numeric');mw.appendChild(p2);
      var lw=document.createElement('div');lw.className='lp-ph-last';p3.placeholder='0000';p3.maxLength=4;p3.setAttribute('inputmode','numeric');lw.appendChild(p3);
      row.appendChild(box);row.appendChild(d1);row.appendChild(mw);row.appendChild(d2);row.appendChild(lw);pc.appendChild(row);
      p2.addEventListener('input',function(){if(this.value.length>=4)p3.focus()});
    }

    // 원본 submit 버튼 숨기기 (실제 제출용으로 보관)
    var sb=fw.querySelectorAll('button[type="submit"],input[type="submit"],.wbtn,[class*="submit"]'),ob=sb[0];
    sb.forEach(function(b){b.style.cssText='position:absolute!important;width:1px!important;height:1px!important;clip:rect(0,0,0,0)!important;opacity:0!important;pointer-events:none!important'});

    if(ob){
      // 폼 내부 에러 표시 영역
      var existingErr=fw.querySelector('.lp-form-err');
      var err=existingErr||document.createElement('div');
      if(!existingErr){err.className='lp-form-err';err.id='icFormErr';ob.parentNode.insertBefore(err,ob);}

      // 폼 내부 CTA(무료 상담 받기) 노출
      var innerCta=document.getElementById('formInnerCta');
      if(innerCta)innerCta.style.display='block';

      // 폼 내부 CTA 클릭 → 검증 후 약관 모달 오픈 (v4 핵심 변경)
      var formBtn=document.getElementById('formBtn');
      if(formBtn&&!formBtn.dataset.lpBound){
        formBtn.dataset.lpBound='1';
        formBtn.addEventListener('click',function(){
          var vi=fw.querySelectorAll('input[type="text"]:not([type="hidden"]),input[type="tel"]:not([type="hidden"]),input:not([type])'),ef=[];
          vi.forEach(function(i){if(i.readOnly||i.type==='hidden'||!i.offsetParent)return;if(!i.value.trim())ef.push(i)});
          if(ef.length>0){
            ef.forEach(function(i){i.style.borderColor='#FF8A8A';i.style.boxShadow='0 0 0 3px rgba(239,68,68,.18)';setTimeout(function(){i.style.borderColor='';i.style.boxShadow=''},3000)});
            err.textContent='모든 항목을 입력해주세요';err.style.display='block';err.style.animation='shakeX .4s ease';
            ef[0].focus();
            setTimeout(function(){err.style.display='none'},4000);
            return;
          }
          err.style.display='none';
          openAgree();
        });
      }

      // 약관 모달 "동의하고 상담 신청" → 원본 submit + 모든 체크박스 체크
      var agreeBtn=document.getElementById('agreeBtn');
      if(agreeBtn&&!agreeBtn.dataset.lpBound){
        agreeBtn.dataset.lpBound='1';
        agreeBtn.addEventListener('click',function(){
          var cbs=fw.querySelectorAll('input[type="checkbox"]');
          cbs.forEach(function(c){c.checked=true;try{c.dispatchEvent(new Event('change',{bubbles:true}));}catch(e){}});
          closeAgree();
          ob.style.pointerEvents='auto';ob.click();ob.style.pointerEvents='none';
        });
      }
    }
    return true;
  }

  // 입력 색상/배경 강제 (위젯 inline style 덮기 + autofill 차단)
  function forceAllInputs(){
    var fw=document.getElementById(FORM_ID);if(!fw)return;
    fw.querySelectorAll('input').forEach(function(i){
      if(!i||i.type==='hidden'||i.type==='checkbox'||i.type==='radio')return;
      i.style.setProperty('color','#FFFFFF','important');
      i.style.setProperty('-webkit-text-fill-color','#FFFFFF','important');
      i.style.setProperty('caret-color','#FFFFFF','important');
      i.style.setProperty('font-weight','600','important');
      if(i.closest('.lp-ph-mid')||i.closest('.lp-ph-last')){
        i.style.setProperty('background','transparent','important');
        i.style.setProperty('background-color','transparent','important');
        i.style.setProperty('background-image','none','important');
        i.style.setProperty('border','none','important');
        i.style.setProperty('box-shadow','none','important');
      }else{
        i.style.setProperty('background','rgba(255,255,255,.06)','important');
        i.style.setProperty('background-color','rgba(255,255,255,.06)','important');
        i.style.setProperty('background-image','none','important');
      }
      i.style.setProperty('-webkit-appearance','none','important');
      i.style.setProperty('appearance','none','important');
    });
  }
  setInterval(forceAllInputs,150);
  document.addEventListener('focusin',function(e){if(e.target&&e.target.tagName==='INPUT')forceAllInputs()});
  document.addEventListener('input',function(e){if(e.target&&e.target.tagName==='INPUT')forceAllInputs()});
  document.addEventListener('change',function(e){if(e.target&&e.target.tagName==='INPUT')forceAllInputs()});

  var fr=0,fi=setInterval(function(){if(customizeForm()||fr>30)clearInterval(fi);fr++},500);

  // 스티키 CTA
  var stickyCta=document.getElementById('stickyCta');
  var stickyBtn=document.getElementById('stickyCtaBtn');
  if(stickyCta&&stickyBtn){
    stickyBtn.addEventListener('click',openForm);
    function updateSticky(){
      var y=window.scrollY||window.pageYOffset;
      var atBot=(y+window.innerHeight)>=(document.documentElement.scrollHeight-120);
      stickyCta.classList.toggle('show',!atBot);
    }
    updateSticky();
    window.addEventListener('scroll',updateSticky,{passive:true});
  }
})();
</script>

<div class="sticky-cta" id="stickyCta">
  <div class="sticky-cta-inner">
    <button type="button" class="sticky-cta-btn" id="stickyCtaBtn">
      <span class="shimmer"></span>
      무료 상담 신청하기 →
    </button>
  </div>
</div>

<div style="position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:99999;font:700 11px/1 'Pretendard',sans-serif;color:#fff;background:rgba(31,111,235,.92);padding:6px 13px;border-radius:999px">포트폴리오 예시 · 실제 상담 접수 안 됨</div>
<script>
(function(){
  function thanks(){
    var o=document.createElement('div');
    o.style.cssText='position:fixed;inset:0;z-index:99998;background:rgba(10,14,24,.6);display:flex;align-items:center;justify-content:center;padding:24px';
    o.innerHTML='<div style="background:#fff;border-radius:18px;max-width:340px;width:100%;padding:30px 24px;text-align:center;font-family:Pretendard,sans-serif">'+
      '<div style="width:60px;height:60px;margin:0 auto 16px;border-radius:50%;background:linear-gradient(135deg,#1f6feb,#2b55d8);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center">&#10003;</div>'+
      '<div style="font-size:19px;font-weight:800;color:#1a2030;margin-bottom:8px">상담 신청이 접수되었습니다</div>'+
      '<div style="font-size:13px;color:#8a92a2;line-height:1.6">포트폴리오 예시 페이지입니다.<br>실제로 전송되지 않습니다.</div>'+
      '<button style="margin-top:20px;border:0;background:#eef1f5;color:#5b6472;font-weight:800;padding:12px 28px;border-radius:12px;cursor:pointer">닫기</button></div>';
    o.addEventListener('click',function(e){ if(e.target===o||e.target.tagName==='BUTTON') o.remove(); });
    document.body.appendChild(o);
  }
  document.addEventListener('click',function(e){
    var fid=document.getElementById('agreeBtn')?'#agreeBtn':'#formBtn';var t=e.target.closest&&e.target.closest(fid);
    if(t){ e.preventDefault(); e.stopImmediatePropagation(); thanks(); }
  },true);
})();
</script>
